<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Patients | Ambulance &amp; PTS Management System</title>
<style>
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --surface-2:#F6F8FA; --surface-3:#EEF1F5;
  --line:#D6DCE3; --line-2:#BAC4CF;
  --ink:#111820; --ink-2:#4B5763; --ink-3:#78848F;
  --nav:#1A222C; --nav-ink:#B7C3CF; --nav-ink-2:#7C8B99;
  --accent:#0B6A66; --accent-2:#0E837E; --accent-soft:#DFEEED;
  --ok:#166534; --ok-soft:#E3F2E8;
  --warn:#96560A; --warn-soft:#FBEEDC;
  --stop:#A81C24; --stop-soft:#FAE7E8;
  --info:#1E4E8C; --info-soft:#E6EEF8;
  --seal:#5B21A8; --seal-soft:#F0E8FB;
  --r:6px; --r2:10px;
  --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --shadow:0 1px 2px rgba(17,24,32,.05),0 6px 18px rgba(17,24,32,.06);
}
html[data-theme="dark"]{
  --bg:#0D1218; --surface:#151D26; --surface-2:#1B2530; --surface-3:#212C38;
  --line:#2A3744; --line-2:#3B4C5C;
  --ink:#E7EDF3; --ink-2:#AFBDC9; --ink-3:#8394A2;
  --nav:#0A0F14; --nav-ink:#AEBDCA; --nav-ink-2:#6D7E8D;
  --accent:#2FA39D; --accent-2:#3CB8B1; --accent-soft:#10312F;
  --ok:#63C088; --ok-soft:#11301E; --warn:#DFA45C; --warn-soft:#33260F;
  --stop:#EE868D; --stop-soft:#361619; --info:#7BAEEA; --info-soft:#12253C;
  --seal:#B79BE8; --seal-soft:#241636;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:13.5px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:640;letter-spacing:-.005em}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent-2)}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:1px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.micro{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.muted{color:var(--ink-3)} .nowrap{white-space:nowrap} .spacer{flex:1}

.shell{display:flex;min-height:100vh}
.side{width:214px;flex:0 0 214px;background:var(--nav);color:var(--nav-ink);position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.logo{padding:13px 14px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;gap:9px;align-items:center}
.logo .sq{width:28px;height:28px;flex:0 0 28px;border-radius:5px;background:var(--accent-2);display:grid;place-items:center;color:#04211F;font-weight:800;font-size:11px}
.logo b{display:block;color:#fff;font-size:12.5px;line-height:1.25}
.logo small{display:block;color:var(--nav-ink-2);font-size:10px}
.menu{flex:1;overflow:auto;padding:6px}
.menu .grp{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--nav-ink-2);padding:12px 8px 5px}
.mi{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;color:var(--nav-ink);padding:6px 8px;border-radius:5px;cursor:pointer;font-size:12.5px}
.mi:hover{background:rgba(255,255,255,.06);color:#fff}
.mi[aria-current="page"]{background:var(--accent);color:#fff;font-weight:600}
.mi.stub{color:var(--nav-ink-2)}
.mi .pill{margin-left:auto;font:600 10px/1 var(--mono);background:rgba(255,255,255,.13);padding:3px 5px;border-radius:9px}
.mi .planned{margin-left:auto;font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--nav-ink-2)}
.sfoot{padding:9px 14px;border-top:1px solid rgba(255,255,255,.08);font-size:9.5px;color:var(--nav-ink-2);line-height:1.5}

.body{flex:1;min-width:0;display:flex;flex-direction:column}
.bar{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line);padding:8px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.bar .search{position:relative;flex:1 1 300px;max-width:440px}
.bar .search input{width:100%;padding:6px 10px 6px 28px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface-2)}
.bar .search::before{content:"⌕";position:absolute;left:9px;top:4px;color:var(--ink-3);font-size:15px}
.role select{padding:5px 8px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface-2);max-width:230px}
.page{padding:16px;max-width:1520px;width:100%}
.ph{display:flex;align-items:flex-end;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.ph h1{font-size:18px}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);padding:6px 11px;border-radius:var(--r);cursor:pointer;font-weight:550;font-size:12.5px}
.btn:hover{border-color:var(--accent);color:var(--accent-2)}
.btn.p{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.p:hover{background:var(--accent-2);color:#fff}
.btn.seal{border-color:var(--seal);color:var(--seal)}
.btn.seal:hover{background:var(--seal-soft)}
.btn.danger{border-color:var(--stop);color:var(--stop)}
.btn.g{background:transparent}
.btn.xs{padding:3px 8px;font-size:11.5px}
.btn[disabled]{opacity:.42;cursor:not-allowed}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);box-shadow:var(--shadow)}
.card>.h{padding:10px 13px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px}
.card>.h h2{font-size:13px}
.card>.b{padding:13px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:1000px){.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:720px){.g2,.g3{grid-template-columns:1fr}}

label.f{display:block;margin-bottom:10px}
label.f>span{display:block;font-size:11px;font-weight:640;color:var(--ink-2);margin-bottom:3px}
label.f .rq{color:var(--stop)}
input[type=text],input[type=email],input[type=tel],input[type=date],input[type=number],input[type=search],select,textarea{
  width:100%;padding:6px 9px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface)}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent-2);outline:2px solid var(--accent-soft)}
.bad{border-color:var(--stop)!important;background:var(--stop-soft)}
.msg{display:none;color:var(--stop);font-size:11.5px;margin-top:3px}
.msg.on{display:block}
.hint{font-size:11px;color:var(--ink-3);margin-top:3px}
.chk{display:flex;gap:6px;align-items:center;font-size:12.5px;padding:3px 0}
.chk input{width:auto}

.tw{overflow:auto;border:1px solid var(--line);border-radius:var(--r2);background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{position:sticky;top:0;background:var(--surface-2);text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);
   font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap;font-weight:700}
th button{background:none;border:0;padding:0;cursor:pointer;font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit}
td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr[data-open]{cursor:pointer}
tbody tr[data-open]:hover{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}

.bdg{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 6px;border-radius:3px;border:1px solid;white-space:nowrap}
.b-ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.b-warn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.b-stop{background:var(--stop-soft);color:var(--stop);border-color:var(--stop)}
.b-info{background:var(--info-soft);color:var(--info);border-color:var(--info)}
.b-seal{background:var(--seal-soft);color:var(--seal);border-color:var(--seal)}
.b-grey{background:var(--surface-3);color:var(--ink-2);border-color:var(--line-2)}

.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:10px 12px;text-align:left;cursor:pointer;box-shadow:var(--shadow)}
.stat:hover{border-color:var(--accent)}
.stat .v{font:700 22px/1.1 var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat .k{font-size:11.5px;color:var(--ink-2);margin-top:3px}
.stat .x{font-size:10.5px;color:var(--ink-3)}
.stat.warn .v{color:var(--warn)} .stat.stop .v{color:var(--stop)} .stat.seal .v{color:var(--seal)}

/* ---- SIGNATURE 1: the identity band (three-point check) ---- */
.idband{display:flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:var(--r2);overflow:hidden;background:var(--surface)}
.idband .seg{flex:1 1 190px;padding:10px 14px;border-right:1px solid var(--line-2)}
.idband .seg:last-child{border-right:0}
.idband .k{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.idband .v{font:700 19px/1.15 var(--mono);letter-spacing:.01em;margin-top:4px;word-break:break-word}
.idband .v.name{font-family:var(--sans);letter-spacing:-.015em}
.idband .sub{font-size:11px;color:var(--ink-3);margin-top:2px}
.idnote{font-size:11px;color:var(--ink-3);margin-top:5px}

/* ---- SIGNATURE 2: alert tiles ---- */
.tiles{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}
.tile{flex:1 1 178px;min-width:158px;border:1px solid;border-radius:var(--r);padding:8px 10px;background:var(--surface)}
.tile .k{font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;font-weight:800}
.tile .t{font-size:12px;margin-top:3px;color:var(--ink-2)}
.tile .m{font-size:10px;color:var(--ink-3);margin-top:4px;font-family:var(--mono)}
.tile.red{border-color:var(--stop);background:var(--stop-soft)} .tile.red .k{color:var(--stop)}
.tile.amb{border-color:var(--warn);background:var(--warn-soft)} .tile.amb .k{color:var(--warn)}
.tile.blu{border-color:var(--info);background:var(--info-soft)} .tile.blu .k{color:var(--info)}

/* ---- sealed sections ---- */
.sealed{border:1.5px dashed var(--seal);border-radius:var(--r2);padding:22px;text-align:center;
  background:repeating-linear-gradient(135deg,transparent,transparent 9px,var(--seal-soft) 9px,var(--seal-soft) 18px)}
.sealed .lk{font-size:24px}
.sealed h3{color:var(--seal);font-size:14px;margin:6px 0 4px}
.sealed p{margin:0 auto;max-width:520px;font-size:12.5px;color:var(--ink-2)}
.openbanner{background:var(--seal-soft);border:1px solid var(--seal);color:var(--seal);border-radius:var(--r);
  padding:7px 11px;font-size:11.5px;font-weight:650;margin-bottom:11px}

.alertbox{border:1px solid var(--stop);background:var(--stop-soft);color:var(--stop);border-radius:var(--r2);padding:10px 13px;margin-bottom:12px}
.alertbox b{display:block;font-size:12px;letter-spacing:.04em;text-transform:uppercase;margin-bottom:4px}
.alertbox ul{margin:0;padding-left:16px;font-size:12.5px}

.tabs{display:flex;gap:1px;border-bottom:1px solid var(--line);overflow:auto;background:var(--surface);border-radius:var(--r2) var(--r2) 0 0;padding:0 6px}
.tab{background:none;border:0;padding:9px 12px;cursor:pointer;color:var(--ink-2);border-bottom:2px solid transparent;font-weight:550;white-space:nowrap;font-size:12.5px}
.tab[aria-selected="true"]{color:var(--accent-2);border-bottom-color:var(--accent-2)}
.tab .lock{font-size:10px;opacity:.7}

dl.kv{display:grid;grid-template-columns:190px 1fr;gap:6px 14px;margin:0}
dl.kv dt{font-size:11px;color:var(--ink-3);font-weight:650}
dl.kv dd{margin:0}
@media(max-width:640px){dl.kv{grid-template-columns:1fr;gap:1px}dl.kv dd{margin-bottom:7px}}

ul.feed{list-style:none;margin:0;padding:0}
ul.feed li{padding:8px 0 8px 13px;border-left:2px solid var(--line-2);position:relative}
ul.feed li::before{content:"";position:absolute;left:-4px;top:12px;width:6px;height:6px;border-radius:50%;background:var(--accent-2)}
ul.feed li.seal::before{background:var(--seal)}
ul.feed .m{font-size:11px;color:var(--ink-3);font-family:var(--mono)}
ul.feed .s{font-weight:600;margin-top:2px}
ul.feed .d{margin-top:2px;white-space:pre-wrap;color:var(--ink-2)}

.inline{background:var(--surface-2);border:1px dashed var(--line-2);border-radius:var(--r2);padding:11px;margin-top:12px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1 1 140px}
.empty{padding:34px 16px;text-align:center;color:var(--ink-2)}
.empty b{display:block;color:var(--ink);font-size:14px;margin-bottom:4px}

#toasts{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:6px;align-items:center}
.toast{background:var(--nav);color:#fff;padding:8px 14px;border-radius:18px;font-size:12.5px;box-shadow:var(--shadow)}
.toast.ok{background:var(--ok)} .toast.bad{background:var(--stop)} .toast.seal{background:var(--seal)}

.scrim{position:fixed;inset:0;background:rgba(10,16,22,.55);z-index:60}
.modal{position:fixed;z-index:61;top:50%;left:50%;transform:translate(-50%,-50%);width:min(580px,94vw);max-height:88vh;overflow:auto;
  background:var(--bg);border:1px solid var(--line);border-radius:var(--r2);box-shadow:var(--shadow)}
.modal .mh{padding:12px 15px;border-bottom:1px solid var(--line);background:var(--surface);display:flex;align-items:center;gap:10px}
.modal .mb{padding:15px}
.modal .mf{padding:11px 15px;border-top:1px solid var(--line);background:var(--surface);display:flex;gap:8px;justify-content:flex-end}

.demo{background:var(--warn-soft);border:1px solid var(--warn);color:var(--warn);border-radius:var(--r);padding:6px 11px;font-size:11.5px;font-weight:650;margin-bottom:12px}
.deny{max-width:560px;margin:60px auto;text-align:center}

.sidetoggle{display:none}
@media(max-width:920px){
  .side{position:fixed;z-index:70;transform:translateX(-100%);transition:transform .16s}
  .side.open{transform:none}
  .sidetoggle{display:inline-flex}
  .page{padding:12px}
}
@media print{.side,.bar,.mf,.inline,.tabs{display:none}.page{padding:0}.sealed{display:none}}
</style>

<div class="shell">
  <nav class="side" id="side" aria-label="Main navigation">
    <div class="logo"><div class="sq" aria-hidden="true">PT</div>
      <div><b>Ambulance &amp; PTS</b><small>Management System</small></div></div>
    <div class="menu" id="menu"></div>
    <div class="sfoot">Demonstration build · Patients module<br>Branding is placeholder</div>
  </nav>
  <div class="body">
    <header class="bar">
      <button class="btn g sidetoggle" id="sidetoggle" aria-label="Show navigation">☰</button>
      <div class="search"><input id="gsearch" type="search" placeholder="Search by surname, NHS number, date of birth or address" aria-label="Search patients"></div>
      <div class="spacer"></div>
      <div class="role"><span class="micro">Role</span> <select id="rolepick" aria-label="Signed-in role"></select></div>
      <button class="btn g" id="theme" aria-label="Switch theme" title="Switch theme">◐</button>
    </header>
    <div class="page" id="page"></div>
  </div>
</div>
<div id="modalhost"></div>
<div id="toasts" aria-live="polite"></div>

<script>
(function(){
"use strict";

/* ============================================================
   PATIENTS — master patient index
   Ambulance & Patient Transport Management System

   Patient records hold special-category personal data. This module
   is built around that: sections are sealed by role, privileged
   roles can open a sealed section only with a recorded reason, and
   every view of a record is written to an access log.
   ============================================================ */

const KEY="pts:patients:v1", BOOK_KEY="pts:bookings:v1";

/* ---------- reference data ---------- */
const MOBILITY=["Walking, unaided","Walking, needs assistance","Walking frame","Own wheelchair",
  "Our wheelchair","Carry chair","Stretcher","Bariatric stretcher"];
const HANDLING=["Independent","Stand-aid","One-person assist","Two-person assist","Hoist — full sling","Four-person bariatric transfer"];
const COMMS_METHOD=["Telephone","Mobile","Text message","Email","Letter","Through next of kin","Through care home"];
const COMMS_NEEDS=["None recorded","Interpreter required","British Sign Language","Large print","Easy read",
  "Hearing loop","Speaks quietly — allow time","Non-verbal — uses communication board"];
const FUNDING=["NHS commissioned","Local authority funded","Continuing healthcare","Insurance funded",
  "Self-funding","Charity funded","Contract — care home"];
const ALERT_KINDS=["Allergy","Safeguarding","Behavioural","Infection","Clinical","Mobility","Communication","Access"];
const CONSENT_TYPES=["Consent to transport","Consent to share information","Best-interests decision",
  "Mental capacity assessment","Advance decision recorded","Consent withdrawn"];
const STATUSES=["Active","Inactive","Deceased","Archived","Merged"];

const ROLES=[
  {id:"super",   name:"Super Administrator",          p:["view","edit","clinical","safeguarding","consent","sar","merge","alerts","access.log"]},
  {id:"director",name:"Company Director",             p:["view","clinical","safeguarding","sar","access.log"]},
  {id:"ops",     name:"Operations Manager",           p:["view","edit","clinical","safeguarding","consent","sar","merge","alerts","access.log"]},
  {id:"dispatch",name:"Control Room Dispatcher",      p:["view","edit","alerts","clinical.breakglass"]},
  {id:"clinical",name:"Clinical Lead",                p:["view","clinical","safeguarding","consent","alerts","access.log"]},
  {id:"para",    name:"Paramedic",                    p:["view","clinical","alerts","safeguarding.breakglass"]},
  {id:"emt",     name:"Emergency Medical Technician", p:["view","clinical","alerts"]},
  {id:"aca",     name:"Ambulance Care Assistant",     p:["view","alerts","clinical.breakglass"]},
  {id:"driver",  name:"Driver",                       p:["view.transport"]},
  {id:"event",   name:"Event Medical Staff",          p:[]},
  {id:"hr",      name:"HR & Compliance Officer",      p:[]},
  {id:"fleet",   name:"Fleet Manager",                p:[]},
  {id:"finance", name:"Finance Officer",              p:["view","funding"]},
  {id:"qa",      name:"Quality Assurance Officer",    p:["view","clinical","safeguarding","sar","access.log"]},
  {id:"portal",  name:"Commissioner / Customer Portal User", p:["view.own"], commissioner:"Meadowvale Integrated Care Board"}
];

const MENU=[
  {g:"Operations"},
  {id:"dashboard",label:"Dashboard",stub:1},{id:"crm",label:"CRM",stub:1},
  {id:"patients",label:"Patients",live:1},
  {id:"newpatient",label:"Add patient",live:1,indent:1},
  {id:"duplicates",label:"Possible duplicates",live:1,indent:1},
  {id:"bookings",label:"Bookings",stub:1},{id:"cad",label:"CAD and Dispatch",stub:1},
  {id:"map",label:"Live Map",stub:1},{id:"epcr",label:"ePCR",stub:1},{id:"events",label:"Events",stub:1},
  {g:"Workforce"},
  {id:"staff",label:"Staff",stub:1},{id:"rota",label:"Rota",stub:1},{id:"training",label:"Training",stub:1},
  {g:"Assets"},
  {id:"fleet",label:"Fleet",stub:1},{id:"equipment",label:"Equipment",stub:1},{id:"stock",label:"Stock and Medicines",stub:1},
  {g:"Governance"},
  {id:"incidents",label:"Incidents",stub:1},{id:"safeg",label:"Safeguarding",stub:1},
  {id:"qa",label:"Quality Assurance",stub:1},{id:"policies",label:"Policies",stub:1},
  {id:"accesslog",label:"Record access log",live:1},
  {g:"Business"},
  {id:"finance",label:"Finance",stub:1},{id:"reports",label:"Reports",stub:1},
  {id:"actions",label:"Action Centre",stub:1},{id:"settings",label:"Settings",stub:1}
];

/* ---------- state ---------- */
let S={patients:[],bookings:[],seq:0,view:"patients",roleId:"ops",selected:null,tab:"summary",
  sort:{k:"surname",d:"asc"},
  f:{q:"",alert:"",mobility:"",funding:"",status:"Active"},
  opened:{}, bookingsLinked:false, patientLink:{}};
let storageOK=true;

/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const role=()=>ROLES.find(r=>r.id===S.roleId)||ROLES[0];
const can=p=>role().p.includes(p);
const anyAccess=()=>role().p.length>0;
const driverOnly=()=>can("view.transport")&&!can("view");
const portalOnly=()=>can("view.own");

const todayISO=()=>new Date().toISOString().slice(0,10);
function ukd(iso){if(!iso)return "—";const d=new Date(iso.length<=10?iso+"T00:00:00":iso);if(isNaN(d))return "—";
  return String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+d.getFullYear();}
function uks(iso){if(!iso)return "—";const d=new Date(iso);if(isNaN(d))return "—";
  return ukd(iso)+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");}
function age(dob){if(!dob)return "";const d=new Date(dob+"T00:00:00"),n=new Date();
  let a=n.getFullYear()-d.getFullYear();const m=n.getMonth()-d.getMonth();
  if(m<0||(m===0&&n.getDate()<d.getDate()))a--;return a;}
const nhsFmt=n=>{const d=String(n||"").replace(/\D/g,"");return d.length===10?d.slice(0,3)+" "+d.slice(3,6)+" "+d.slice(6):n||"—";};
function toast(m,k){const t=document.createElement("div");t.className="toast"+(k?" "+k:"");t.textContent=m;
  $("#toasts").appendChild(t);setTimeout(()=>{t.style.transition="opacity .3s";t.style.opacity=0;setTimeout(()=>t.remove(),320);},3000);}

/* ---------- persistence ---------- */
async function save(){
  try{if(window.storage&&storageOK)await window.storage.set(KEY,JSON.stringify({patients:S.patients,seq:S.seq}));}
  catch(e){if(storageOK){storageOK=false;toast("Changes are held for this session only.","bad");}}
}
async function load(){
  try{if(!window.storage){storageOK=false;return false;}
    const r=await window.storage.get(KEY);
    if(r&&r.value){const d=JSON.parse(r.value);
      if(d&&Array.isArray(d.patients)&&d.patients.length){S.patients=d.patients;S.seq=d.seq||d.patients.length;return true;}}
  }catch(e){}
  return false;
}
async function loadBookings(){
  try{if(!window.storage)return false;
    const r=await window.storage.get(BOOK_KEY);
    if(r&&r.value){const d=JSON.parse(r.value);
      if(d&&Array.isArray(d.bookings)&&d.bookings.length){
        S.bookings=d.bookings;
        /* the Bookings module keys patients by its own ids — match them to ours on NHS number */
        const byNHS={};
        (d.patients||[]).forEach(bp=>{const k=String(bp.nhs||"").replace(/\D/g,"");if(k)byNHS[k]=bp.id;});
        S.patientLink={};
        S.patients.forEach(x=>{const k=String(x.nhs||"").replace(/\D/g,"");if(k&&byNHS[k])S.patientLink[x.id]=byNHS[k];});
        return true;}}
  }catch(e){}
  return false;
}

/* ---------- audit and access logging ---------- */
function log(p,action,detail){
  p.audit.push({id:uid(),at:new Date().toISOString(),by:role().name,action,detail:detail||""});
  p.updatedAt=new Date().toISOString();
}
function access(p,action,detail,sealBreak){
  p.access.push({id:uid(),at:new Date().toISOString(),by:role().name,action,detail:detail||"",seal:!!sealBreak});
  if(p.access.length>120) p.access=p.access.slice(-120);
}

/* ============================================================
   ACCESS CONTROL — what this role may see on a patient record
   ============================================================ */
const openKey=(pid,sec)=>pid+":"+sec;
function sectionState(p,sec){
  /* returns: "open" | "sealed" | "breakglass" */
  if(sec==="clinical"){
    if(can("clinical")) return "open";
    if(S.opened[openKey(p.id,sec)]) return "open";
    if(can("clinical.breakglass")) return "breakglass";
    return "sealed";
  }
  if(sec==="safeguarding"){
    if(can("safeguarding")) return "open";
    if(S.opened[openKey(p.id,sec)]) return "open";
    if(can("safeguarding.breakglass")) return "breakglass";
    return "sealed";
  }
  if(sec==="consent") return can("consent")||can("clinical")?"open":"sealed";
  if(sec==="funding") return can("funding")||can("edit")||can("clinical")||can("sar")?"open":"sealed";
  return "open";
}
function sealedPanel(sec,p){
  const st=sectionState(p,sec);
  const label=sec==="clinical"?"Clinical detail":sec==="safeguarding"?"Safeguarding record":"This section";
  if(st==="breakglass")
    return '<div class="sealed"><div class="lk" aria-hidden="true">🔐</div>'+
      '<h3>'+esc(label)+' is restricted</h3>'+
      '<p>Your role can open this section when there is a direct care reason. Opening it records your name, the time '+
      'and the reason you give in the patient\'s access log, and the record owner can see it.</p>'+
      '<button class="btn seal" id="breakglass" data-sec="'+sec+'" style="margin-top:12px">Open with a recorded reason</button></div>';
  return '<div class="sealed"><div class="lk" aria-hidden="true">🔒</div>'+
    '<h3>'+esc(label)+' is not available to your role</h3>'+
    '<p>This is special-category data. The <strong>'+esc(role().name)+'</strong> role does not carry access to it, '+
    'and it cannot be unlocked from here. Ask a clinical lead or the operations manager if you need it for direct care.</p></div>';
}

/* ---------- alerts ---------- */
function alertTone(k){
  if(["Allergy","Safeguarding","Behavioural","Infection"].includes(k)) return "red";
  if(["Clinical","Mobility","Access"].includes(k)) return "amb";
  return "blu";
}
/* alerts a role may see: safeguarding alerts are themselves restricted */
function visibleAlerts(p){
  return p.alerts.filter(a=>{
    if(a.kind==="Safeguarding") return sectionState(p,"safeguarding")==="open";
    /* allergy and infection are safety-critical and travel with the crew; clinical narrative does not */
    if(a.kind==="Allergy"||a.kind==="Infection") return sectionState(p,"clinical")==="open"||can("alerts")||driverOnly();
    if(a.kind==="Clinical"||a.kind==="Behavioural") return sectionState(p,"clinical")==="open"||can("alerts");
    return true;
  });
}

function nextRef(){S.seq+=1;return "PAT-"+String(S.seq).padStart(5,"0");}
function blankPatient(){
  return {id:uid(),ref:"",surname:"",forename:"",preferred:"",dob:"",nhs:"",status:"Active",
    address:"",postcode:"",phone:"",mobile:"",email:"",
    nok:{name:"",relationship:"",phone:""},emergency:{name:"",relationship:"",phone:""},

    funding:"",commissioner:"",accessNotes:"",
    alerts:[],consents:[],documents:[],audit:[],access:[],
    clinicalRecords:0,mergedInto:"",createdAt:"",updatedAt:""};
}
function commit(d){
  const p=Object.assign(blankPatient(),d);
  const now=new Date().toISOString();
  p.id=uid();p.ref=nextRef();p.createdAt=now;p.updatedAt=now;
  p.audit=[{id:uid(),at:now,by:role().name,action:"Patient record created",detail:p.surname+", "+p.forename}];
  return p;
}
function possibleDuplicates(p){
  return S.patients.filter(x=>{
    if(x.id===p.id||x.status==="Merged") return false;
    const sameNHS=p.nhs&&x.nhs&&x.nhs.replace(/\D/g,"")===p.nhs.replace(/\D/g,"");
    const sameNameDOB=p.dob&&x.dob===p.dob&&x.surname.toLowerCase()===p.surname.toLowerCase();
    return sameNHS||sameNameDOB;
  });
}
function allDuplicatePairs(){
  const out=[],seen={};
  S.patients.forEach(p=>{
    if(p.status==="Merged") return;
    possibleDuplicates(p).forEach(q=>{
      const k=[p.id,q.id].sort().join("|");
      if(seen[k]) return; seen[k]=1;
      out.push([p,q]);
    });
  });
  return out;
}

/* ---------- filtering ---------- */
function visible(){
  let list=S.patients.filter(p=>p.status!=="Merged");
  if(portalOnly()) list=list.filter(p=>p.commissioner===role().commissioner);
  const f=S.f,q=f.q.trim().toLowerCase(),qd=q.replace(/\D/g,"");
  list=list.filter(p=>{
    if(f.status&&p.status!==f.status) return false;
    if(f.mobility&&p.mobility!==f.mobility) return false;
    if(f.funding&&p.funding!==f.funding) return false;
    if(f.alert&&!p.alerts.some(a=>a.kind===f.alert)) return false;
    if(q){
      const hay=[p.ref,p.surname,p.forename,p.preferred,p.address,p.postcode,p.commissioner].join(" ").toLowerCase();
      const nums=[p.nhs.replace(/\D/g,""),p.dob.replace(/\D/g,"")].join(" ");
      if(!hay.includes(q)&&!(qd.length>=4&&nums.includes(qd))) return false;
    }
    return true;
  });
  const k=S.sort.k,d=S.sort.d==="asc"?1:-1;
  list.sort((a,b)=>{
    let x,y;
    if(k==="dob"){x=a.dob;y=b.dob;}
    else if(k==="alerts"){x=a.alerts.length;y=b.alerts.length;}
    else if(k==="updated"){x=a.updatedAt;y=b.updatedAt;}
    else{x=String(a[k]||"").toLowerCase();y=String(b[k]||"").toLowerCase();}
    return x<y?-d:x>y?d:0;
  });
  return list;
}

    const cur=S.view===m.id||(m.id==="patients"&&S.view==="patient");

      :m.id==="duplicates"&&dup?'<span class="pill">'+dup+'</span>'

      '<dt>Medical conditions</dt><dd>'+esc(p.conditions||"None recorded")+'</dd>'+
      '<dt>Allergies</dt><dd>'+(p.allergies&&p.allergies!=="None known."?'<strong style="color:var(--stop)">'+esc(p.allergies)+'</strong>':esc(p.allergies||"None known"))+'</dd>'+
      '<dt>Current medication</dt><dd>'+esc(p.medication||"None recorded")+'</dd>'+
      '<dt>Oxygen requirements</dt><dd>'+esc(p.oxygen||"None")+'</dd>'+
      '<dt>Clinical support on the journey</dt><dd>'+esc(p.clinicalSupport||"None")+'</dd>'+
      '<dt>Behavioural risks</dt><dd>'+esc(p.behavioural||"None recorded")+'</dd>'+
      '<dt>Clinical records</dt><dd>'+(p.clinicalRecords?p.clinicalRecords+' patient care records held in the ePCR module':'None held')+'</dd>'+
    '</dl>'+
    (can("clinical")&&can("edit")?'<div class="inline">'+
      '<label class="f"><span>Medical conditions</span><textarea id="e-cond">'+esc(p.conditions)+'</textarea></label>'+
      '<label class="f"><span>Allergies</span><textarea id="e-allergy">'+esc(p.allergies)+'</textarea></label>'+
      '<label class="f"><span>Current medication</span><textarea id="e-med">'+esc(p.medication)+'</textarea></label>'+
      '<div class="row"><label class="f" style="margin:0"><span>Oxygen</span><input type="text" id="e-oxy" value="'+esc(p.oxygen)+'"></label>'+
      '<label class="f" style="margin:0"><span>Clinical support</span><input type="text" id="e-support" value="'+esc(p.clinicalSupport)+'"></label></div>'+
      '<button class="btn p xs" id="save-clinical" style="margin-top:9px">Save clinical detail</button></div>':'');
  }

  if(t==="capacity"){
    if(sectionState(p,"consent")!=="open")
      return '<div class="sealed"><div class="lk">🔒</div><h3>Capacity and consent are not available to your role</h3>'+
        '<p>Capacity assessments and consent records are limited to clinical and management roles.</p></div>';
    return '<dl class="kv"><dt>Mental capacity</dt><dd>'+esc(p.capacity||"No assessment recorded")+'</dd></dl>'+
      '<h3 style="font-size:12.5px;margin:16px 0 7px">Consent records</h3>'+
      (p.consents.length?'<div class="tw" style="border:0"><table><thead><tr><th>Type</th><th>Date</th><th>Recorded by</th><th>Notes</th>'+

          '<tr><td><strong>'+esc(c.type)+'</strong></td><td class="num nowrap">'+ukd(c.date)+'</td>'+
          '<td class="muted nowrap">'+esc(c.by)+'</td><td class="muted">'+esc(c.notes)+'</td>'+
          (can("consent")?'<td class="r"><button class="btn xs g" data-rmconsent="'+c.id+'">Remove</button></td>':'')+'</tr>').join("")+
        '</tbody></table></div>'
        :'<div class="empty"><b>No consent records</b>Consent or a best-interests decision should be recorded before transport.</div>')+
      (can("consent")?'<div class="inline"><div class="row">'+
        '<label class="f" style="margin:0"><span>Type</span><select id="cs-type">'+
          CONSENT_TYPES.map(x=>'<option>'+esc(x)+'</option>').join("")+'</select></label>'+
        '<label class="f" style="margin:0"><span>Date</span><input type="date" id="cs-date" value="'+todayISO()+'"></label>'+
        '<label class="f" style="margin:0;flex:2 1 200px"><span>Notes</span><input type="text" id="cs-notes" placeholder="Who gave it, how it was obtained, any limits">'+
          '<div class="msg" id="m-cs-notes">Record how consent was obtained.</div></label>'+
        '</div><button class="btn p xs" id="add-consent" style="margin-top:9px">Record consent</button></div>':'');
  }

  if(t==="safeguarding"){
    const st=sectionState(p,"safeguarding");
    if(st!=="open") return sealedPanel("safeguarding",p);
    return (S.opened[openKey(p.id,"safeguarding")]?'<div class="openbanner">You opened this restricted section with a recorded reason. '+
      'It is visible for this session only and has been written to the access log, which the record owner can review.</div>':'')+

      '<div style="font-size:12.5px;white-space:pre-wrap">'+esc(p.safeguarding)+'</div></div>'
      :'<div class="empty"><b>No safeguarding record</b>Nothing has been recorded against this patient.</div>')+

      'coordinators need to know to keep the patient safe on a journey.</p>'+

      '<label class="f"><span>Safeguarding notes for transport</span><textarea id="e-safeg">'+esc(p.safeguarding)+'</textarea>'+

  if(t==="contacts"){

      'third parties is minimised deliberately.</p>';

  if(t==="journeys"){

      '<p class="hint">Change history is immutable.</p>';
  }
  return "";
}

/* ---------- global access log ---------- */
function viewAccessLog(){
  if(!can("access.log")) return viewDenied();
  const all=[];
  S.patients.forEach(p=>p.access.forEach(a=>all.push({...a,ref:p.ref,name:p.surname+", "+p.forename,pid:p.id})));
  all.sort((a,b)=>b.at.localeCompare(a.at));
  const rows=all.slice(0,250);
  const breaks=all.filter(a=>a.seal).length;
  return demoNote+
  '<div class="ph"><h1>Record access log</h1><span class="muted">'+all.length+' entries · '+breaks+' restricted-section openings</span></div>'+
  '<div class="card" style="margin-bottom:12px"><div class="b"><p class="hint" style="margin:0">'+
    'This is the user activity report for patient records. Openings of a restricted section are highlighted — each one carries '+

  '<div class="tw"><table><thead><tr><th>When</th><th>Patient</th><th>Who</th><th>Action</th><th>Reason or context</th></tr></thead><tbody>'+
  rows.map(a=>'<tr tabindex="0" data-open="'+a.pid+'"'+(a.seal?' style="background:var(--seal-soft)"':'')+'>'+

/* ============================================================
   EVENTS
   ============================================================ */
function go(v){S.view=v;S.selected=null;render();window.scrollTo(0,0);$("#side").classList.remove("open");}
function openP(id){
  const p=S.patients.find(x=>x.id===id);
  if(!p) return;
  if(portalOnly()&&p.commissioner!==role().commissioner){toast("Your portal account can only see patients it commissions.","bad");return;}
  S.selected=id;S.view="patient";S.tab=driverOnly()?"transport":"summary";
  access(p,"Record viewed",""); save();
  render();window.scrollTo(0,0);
}
const val=id=>{const e=document.getElementById(id);return e?e.value.trim():"";};
function mark(id,mid,ok){const e=document.getElementById(id),m=document.getElementById(mid);
  if(e)e.classList.toggle("bad",!ok);if(m)m.classList.toggle("on",!ok);return ok;}

document.addEventListener("click", async e=>{
  const t=e.target.closest("[data-go],[data-open],[data-tab],[data-sort],[data-stat],[data-mclose],[data-merge],[data-rmdoc],[data-rmconsent],button");
  if(!t) return;
  const p=S.patients.find(x=>x.id===S.selected);

  if(t.dataset.mclose){closeModal();return;}
  if(t.dataset.go){const m=MENU.find(x=>x.id===t.dataset.go);
    if(m&&!m.live){S.view=t.dataset.go;S.selected=null;render();$("#side").classList.remove("open");return;}
    go(t.dataset.go);return;}
  if(t.dataset.open){openP(t.dataset.open);return;}
  if(t.dataset.tab){S.tab=t.dataset.tab;render();return;}
  if(t.dataset.sort){const k=t.dataset.sort;S.sort=S.sort.k===k?{k,d:S.sort.d==="asc"?"desc":"asc"}:{k,d:"asc"};render();return;}
  if(t.dataset.stat!==undefined&&t.classList.contains("stat")){
    if(+t.dataset.stat===5){go("duplicates");return;}
    const presets=[{status:"Active"},{alert:"Safeguarding"},{alert:"Allergy"},{status:"Active"},{alert:"Infection"}];
    S.f=Object.assign({q:"",alert:"",mobility:"",funding:"",status:""},presets[+t.dataset.stat]);
    go("patients");return;
  }
  if(t.dataset.merge){
    if(!can("merge")){toast("Merging needs an operations manager or administrator.","bad");return;}
    const [keepId,goneId]=t.dataset.merge.split("|");
    const keep=S.patients.find(x=>x.id===keepId),gone=S.patients.find(x=>x.id===goneId);
    if(!keep||!gone) return;
    gone.alerts.forEach(a=>{if(!keep.alerts.some(b=>b.kind===a.kind&&b.text===a.text))keep.alerts.push(a);});
    gone.consents.forEach(c=>keep.consents.push(c));
    gone.documents.forEach(d=>keep.documents.push(d));
    if(!keep.nhs&&gone.nhs) keep.nhs=gone.nhs;
    if(!keep.accessNotes&&gone.accessNotes) keep.accessNotes=gone.accessNotes;
    gone.status="Merged"; gone.mergedInto=keep.ref;
    log(keep,"Records merged","Absorbed "+gone.ref+" — alerts, consents and documents moved across");
    log(gone,"Record merged","Merged into "+keep.ref+". Retained, not deleted.");
    await save();toast(gone.ref+" merged into "+keep.ref,"ok");render();return;
  }

  const id=t.id;
  if(id==="theme"){const n=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";
    document.documentElement.setAttribute("data-theme",n);
    try{if(window.storage)window.storage.set("pts:theme",n);}catch(_){}return;}
  if(id==="sidetoggle"){$("#side").classList.toggle("open");return;}
  if(id==="f-clear"){S.f={q:"",alert:"",mobility:"",funding:"",status:"Active"};render();return;}
  if(id==="printrec"){window.print();return;}
  if(id==="export"){exportCSV();return;}

  /* new patient */
  if(id==="n-save"){
    let ok=true;
    ok=mark("n-surname","m-n-surname",!!val("n-surname"))&&ok;
    ok=mark("n-forename","m-n-forename",!!val("n-forename"))&&ok;
    ok=mark("n-dob","m-n-dob",!!val("n-dob"))&&ok;
    ok=mark("n-address","m-n-address",!!val("n-address"))&&ok;
    ok=mark("n-mobility","m-n-mobility",!!val("n-mobility"))&&ok;
    const nhs=val("n-nhs").replace(/\D/g,"");
    ok=mark("n-nhs","m-n-nhs",!val("n-nhs")||nhs.length===10)&&ok;
    if(!ok){toast("Check the highlighted fields.","bad");return;}
    const probe={id:"",surname:val("n-surname"),dob:val("n-dob"),nhs};
    const dups=possibleDuplicates(probe);
    if(dups.length&&!$("#dupwarn").dataset.ack){
      $("#dupwarn").innerHTML='<div class="alertbox"><b>Possible duplicate</b>'+
        '<ul>'+dups.map(d=>'<li>'+esc(d.ref)+' — '+esc(d.surname+", "+d.forename)+', born '+ukd(d.dob)+
          (d.nhs?', NHS '+esc(nhsFmt(d.nhs)):'')+'</li>').join("")+'</ul>'+
        '<div style="font-size:12.5px;margin-top:6px">Check these before creating another record. '+
        'Press <strong>Create record</strong> again if this really is a different person.</div></div>';
      $("#dupwarn").dataset.ack="1";
      toast("Possible duplicate found — check before creating.","bad");
      return;
    }
    const rec=commit({surname:val("n-surname"),forename:val("n-forename"),preferred:val("n-preferred"),
      dob:val("n-dob"),nhs,address:val("n-address"),postcode:val("n-postcode").toUpperCase(),
      phone:val("n-phone"),mobile:val("n-mobile"),mobility:val("n-mobility"),
      funding:val("n-funding"),accessNotes:val("n-access")});
    if(dups.length) log(rec,"Created despite a duplicate warning",dups.map(d=>d.ref).join(", "));
    S.patients.unshift(rec);await save();
    toast("Created "+rec.ref,"ok");openP(rec.id);return;
  }

  if(!p) return;

  /* break glass */
  if(id==="breakglass"){modalBreakGlass(t.dataset.sec);return;}
  if(id==="bg-do"){
    let ok=true;
    ok=mark("bg-reason","m-bg-reason",!!val("bg-reason"))&&ok;
    ok=mark("bg-detail","m-bg-detail",!!val("bg-detail"))&&ok;
    if(!ok) return;
    const sec=t.dataset.sec;
    S.opened[openKey(p.id,sec)]=true;
    access(p,(sec==="clinical"?"Clinical section":"Safeguarding section")+" opened",
      val("bg-reason")+" — "+val("bg-detail"),true);
    log(p,"Restricted section opened",sec+" · "+val("bg-reason"));
    await save();closeModal();
    toast("Opened and recorded in the access log","seal");render();return;
  }

  /* SAR */
  if(id==="sar"){modalSAR(p);return;}
  if(id==="sar-do"){
    if(!mark("sar-by","m-sar-by",!!val("sar-by"))) return;
    const pack={reference:p.ref,producedAt:new Date().toISOString(),producedBy:role().name,
      requestedBy:val("sar-by"),identityCheck:val("sar-id"),
      patient:{name:p.forename+" "+p.surname,preferred:p.preferred,dateOfBirth:p.dob,nhsNumber:p.nhs,
        address:p.address,postcode:p.postcode,telephone:p.phone,mobile:p.mobile},
      transport:{mobility:p.mobility,handling:p.handling,wheelchair:p.wheelchair,stretcher:p.stretcher,
        bariatric:p.bariatric,infectionControl:p.ipc,communicationNeeds:p.commsNeeds,accessNotes:p.accessNotes},
      clinical:{conditions:p.conditions,allergies:p.allergies,medication:p.medication,oxygen:p.oxygen,
        clinicalSupport:p.clinicalSupport,behavioural:p.behavioural},
      capacityAndConsent:{capacity:p.capacity,consents:p.consents},
      safeguarding:p.safeguarding,
      alerts:p.alerts,documents:p.documents.map(d=>({name:d.name,category:d.category,added:d.at})),
      changeHistory:p.audit,accessHistory:p.access,
      note:"Clinical records held in the ePCR module and journey history in Bookings are supplied separately."};
    if(val("sar-fmt").indexOf("Print")===0){ closeModal(); access(p,"Record exported for a subject access request",val("sar-by"));
      log(p,"Subject access request pack produced",val("sar-by")+" · printable"); await save(); window.print(); render(); return; }
    const url=URL.createObjectURL(new Blob([JSON.stringify(pack,null,2)],{type:"application/json"}));
    const a=document.createElement("a");a.href=url;a.download="sar-"+p.ref+"-"+todayISO()+".json";
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),800);
    access(p,"Record exported for a subject access request",val("sar-by"));
    log(p,"Subject access request pack produced",val("sar-by")+" · JSON");
    await save();closeModal();toast("Pack produced and logged","ok");render();return;
  }

  /* edits */
  if(id==="save-summary"){
    const ch=[];
    const set=(k,el,l)=>{const v=val(el);if(v!==p[k]){ch.push(l+" updated");p[k]=v;}};
    set("phone","e-phone","telephone");set("mobile","e-mobile","mobile");
    set("commsMethod","e-commsmethod","preferred contact");set("accessNotes","e-access","access notes");
    const st=val("e-status");if(st!==p.status){ch.push("status "+p.status+" → "+st);p.status=st;}
    if(!ch.length){toast("Nothing to save.");return;}
    log(p,"Record updated",ch.join("; "));await save();toast("Saved","ok");render();return;
  }
  if(id==="save-transport"){
    const ch=[];
    const set=(k,el,l)=>{const v=val(el);if(v!==p[k]){ch.push(l+": "+(p[k]||"—")+" → "+v);p[k]=v;}};
    set("mobility","e-mob","mobility");set("handling","e-handling","handling");set("commsNeeds","e-comms","communication needs");
    set("wheelchair","e-wheel","wheelchair");set("stretcher","e-stretch","stretcher");set("ipc","e-ipc","infection control");
    if(!ch.length){toast("Nothing to save.");return;}
    log(p,"Transport needs updated",ch.join("; "));await save();toast("Saved","ok");render();return;
  }
  if(id==="save-clinical"){
    const ch=[];
    const set=(k,el,l)=>{const v=val(el);if(v!==p[k]){ch.push(l+" updated");p[k]=v;}};
    set("conditions","e-cond","conditions");set("allergies","e-allergy","allergies");
    set("medication","e-med","medication");set("oxygen","e-oxy","oxygen");set("clinicalSupport","e-support","clinical support");
    if(!ch.length){toast("Nothing to save.");return;}
    log(p,"Clinical detail updated",ch.join("; "));await save();toast("Saved","ok");render();return;
  }
  if(id==="save-safeg"){
    const v=$("#e-safeg").value;
    if(v===p.safeguarding){toast("Nothing to save.");return;}
    p.safeguarding=v;log(p,"Safeguarding notes updated","");await save();toast("Saved","ok");render();return;
  }
  if(id==="add-consent"){
    if(!mark("cs-notes","m-cs-notes",!!val("cs-notes"))) return;
    p.consents.push({id:uid(),type:val("cs-type"),date:val("cs-date"),notes:val("cs-notes"),by:role().name});
    log(p,"Consent recorded",val("cs-type"));await save();toast("Consent recorded","ok");render();return;
  }
  if(t.dataset.rmconsent){
    const c=p.consents.find(x=>x.id===t.dataset.rmconsent);
    p.consents=p.consents.filter(x=>x.id!==t.dataset.rmconsent);
    log(p,"Consent record removed",c?c.type+" of "+ukd(c.date):"");await save();render();return;
  }
  if(id==="add-doc"){
    const f=$("#dc-file").files[0];
    if(!f){toast("Choose a file first.","bad");return;}
    p.documents.push({id:uid(),name:f.name,category:val("dc-cat"),size:(f.size/1024).toFixed(0)+" KB",
      by:role().name,at:new Date().toISOString()});
    log(p,"Document attached",f.name);await save();toast("Attached "+f.name,"ok");render();return;
  }
  if(t.dataset.rmdoc){
    const d=p.documents.find(x=>x.id===t.dataset.rmdoc);
    p.documents=p.documents.filter(x=>x.id!==t.dataset.rmdoc);
    log(p,"Document removed",d?d.name:"");await save();render();return;
  }
});

document.addEventListener("change", e=>{
  const el=e.target;
  if(el.id==="rolepick"){S.roleId=el.value;S.selected=null;S.opened={};S.view="patients";
    render();toast("Signed in as "+role().name+" — restricted sections reset");return;}
  const map={"f-alert":"alert","f-mobility":"mobility","f-funding":"funding","f-status":"status"};
  if(map[el.id]){S.f[map[el.id]]=el.value;render();return;}
});

let tm;
document.addEventListener("input", e=>{
  if(e.target.id!=="f-q"&&e.target.id!=="gsearch") return;
  const g=e.target.id==="gsearch";
  S.f.q=e.target.value;
  clearTimeout(tm);
  tm=setTimeout(()=>{
    const pos=e.target.selectionStart;
    if(g){ if(S.view!=="patients"){S.f.status="";go("patients");} else render();
      const x=$("#gsearch");if(x){x.focus();try{x.setSelectionRange(pos,pos);}catch(_){}} }
    else { render(); const x=$("#f-q");if(x){x.focus();try{x.setSelectionRange(pos,pos);}catch(_){}} }
  },220);
});
document.addEventListener("keydown", e=>{
  if(e.key==="Escape"&&$("#modalhost").innerHTML){closeModal();return;}
  if((e.key==="Enter"||e.key===" ")&&e.target.dataset&&e.target.dataset.open){e.preventDefault();openP(e.target.dataset.open);}
});

/* ---------- export (redacted by role) ---------- */
function exportCSV(){
  const rows=visible();
  if(!rows.length){toast("Nothing to export with these filters.","bad");return;}
  const clin=can("clinical");
  const head=["Reference","Surname","Forename","Date of birth","NHS number","Address","Postcode","Telephone",
    "Mobility","Manual handling","Wheelchair","Stretcher","Bariatric","Infection control","Communication needs",
    "Access notes","Status"];
  if(!portalOnly()&&!driverOnly()) head.push("Funding","Commissioner");
  if(clin) head.push("Conditions","Allergies","Medication","Oxygen");
  head.push("Alerts");
  const q=v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"';
  const body=rows.map(p=>{
    const line=[p.ref,p.surname,p.forename,ukd(p.dob),nhsFmt(p.nhs),p.address,p.postcode,p.phone||p.mobile,
      p.mobility,p.handling,p.wheelchair,p.stretcher,p.bariatric,p.ipc,p.commsNeeds,p.accessNotes,p.status];
    if(!portalOnly()&&!driverOnly()) line.push(p.funding,p.commissioner);
    if(clin) line.push(p.conditions,p.allergies,p.medication,p.oxygen);
    line.push(visibleAlerts(p).map(a=>a.kind+": "+a.text).join(" | "));
    return line.map(q).join(",");
  }).join("\r\n");
  const csv="\ufeff"+head.map(q).join(",")+"\r\n"+body;
  const url=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
  const a=document.createElement("a");a.href=url;a.download="patients-"+todayISO()+".csv";
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),800);
  toast("Exported "+rows.length+" records"+(clin?"":" — clinical columns omitted for your role"),"ok");
}

/* ---------- boot ---------- */
(async function(){
  $("#rolepick").innerHTML=ROLES.map(r=>'<option value="'+r.id+'"'+(r.id===S.roleId?' selected':'')+'>'+esc(r.name)+'</option>').join("");
  try{if(window.storage){const th=await window.storage.get("pts:theme");
    if(th&&th.value)document.documentElement.setAttribute("data-theme",th.value);}}catch(_){}
  const had=await load();
  if(!had){seed();await save();}
  S.bookingsLinked=await loadBookings();
  render();
  if(!storageOK) toast("Changes are held for this session only.","bad");
})();

})();
</script>
