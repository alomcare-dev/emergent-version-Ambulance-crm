<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bookings | Ambulance &amp; PTS Management System</title>
<style>
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --surface-2:#F6F8FA; --surface-3:#EEF1F5;
  --line:#D6DCE3; --line-2:#BAC4CF;
  --ink:#111820; --ink-2:#4B5763; --ink-3:#78848F;
  --nav:#1A222C; --nav-ink:#B7C3CF; --nav-ink-2:#7C8B99;
  --accent:#0B6A66; --accent-2:#0E837E; --accent-soft:#DFEEED;
  --ok:#166534; --ok-soft:#E3F2E8;
  --warn:#96560A; --warn-soft:#FBEEDC;
  --stop:#A81C24; --stop-soft:#FAE7E8;
  --info:#1E4E8C; --info-soft:#E6EEF8;
  --live:#5B21A8; --live-soft:#EFE6FA;
  --r:6px; --r2:10px;
  --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --shadow:0 1px 2px rgba(17,24,32,.05),0 6px 18px rgba(17,24,32,.06);
}
html[data-theme="dark"]{
  --bg:#0D1218; --surface:#151D26; --surface-2:#1B2530; --surface-3:#212C38;
  --line:#2A3744; --line-2:#3B4C5C;
  --ink:#E7EDF3; --ink-2:#AFBDC9; --ink-3:#8394A2;
  --nav:#0A0F14; --nav-ink:#AEBDCA; --nav-ink-2:#6D7E8D;
  --accent:#2FA39D; --accent-2:#3CB8B1; --accent-soft:#10312F;
  --ok:#63C088; --ok-soft:#11301E; --warn:#DFA45C; --warn-soft:#33260F;
  --stop:#EE868D; --stop-soft:#361619; --info:#7BAEEA; --info-soft:#12253C;
  --live:#B79BE8; --live-soft:#241636;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:13.5px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:640;letter-spacing:-.005em}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent-2)}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:1px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.micro{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.muted{color:var(--ink-3)} .nowrap{white-space:nowrap} .spacer{flex:1}

.shell{display:flex;min-height:100vh}
.side{width:214px;flex:0 0 214px;background:var(--nav);color:var(--nav-ink);position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.logo{padding:13px 14px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;gap:9px;align-items:center}
.logo .sq{width:28px;height:28px;flex:0 0 28px;border-radius:5px;background:var(--accent-2);display:grid;place-items:center;color:#04211F;font-weight:800;font-size:11px}
.logo b{display:block;color:#fff;font-size:12.5px;line-height:1.25}
.logo small{display:block;color:var(--nav-ink-2);font-size:10px}
.menu{flex:1;overflow:auto;padding:6px}
.menu .grp{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--nav-ink-2);padding:12px 8px 5px}
.mi{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;color:var(--nav-ink);padding:6px 8px;border-radius:5px;cursor:pointer;font-size:12.5px}
.mi:hover{background:rgba(255,255,255,.06);color:#fff}
.mi[aria-current="page"]{background:var(--accent);color:#fff;font-weight:600}
.mi.stub{color:var(--nav-ink-2)}
.mi .pill{margin-left:auto;font:600 10px/1 var(--mono);background:rgba(255,255,255,.13);padding:3px 5px;border-radius:9px}
.mi .planned{margin-left:auto;font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--nav-ink-2)}
.sfoot{padding:9px 14px;border-top:1px solid rgba(255,255,255,.08);font-size:9.5px;color:var(--nav-ink-2);line-height:1.5}

.body{flex:1;min-width:0;display:flex;flex-direction:column}
.bar{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line);padding:8px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.bar .search{position:relative;flex:1 1 300px;max-width:440px}
.bar .search input{width:100%;padding:6px 10px 6px 28px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface-2)}
.bar .search::before{content:"⌕";position:absolute;left:9px;top:4px;color:var(--ink-3);font-size:15px}
.bell{position:relative;background:none;border:1px solid var(--line);border-radius:var(--r);padding:5px 9px;cursor:pointer;color:var(--ink-2)}
.bell b{position:absolute;top:-6px;right:-6px;background:var(--stop);color:#fff;font:700 9.5px/1 var(--mono);padding:3px 4px;border-radius:8px}
.role select{padding:5px 8px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface-2);max-width:230px}
.page{padding:16px;max-width:1520px;width:100%}
.ph{display:flex;align-items:flex-end;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.ph h1{font-size:18px}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);padding:6px 11px;border-radius:var(--r);cursor:pointer;font-weight:550;font-size:12.5px}
.btn:hover{border-color:var(--accent);color:var(--accent-2)}
.btn.p{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.p:hover{background:var(--accent-2);color:#fff}
.btn.danger{border-color:var(--stop);color:var(--stop)}
.btn.danger:hover{background:var(--stop-soft)}
.btn.g{background:transparent}
.btn.xs{padding:3px 8px;font-size:11.5px}
.btn[disabled]{opacity:.42;cursor:not-allowed}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);box-shadow:var(--shadow)}
.card>.h{padding:10px 13px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px}
.card>.h h2{font-size:13px}
.card>.b{padding:13px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1000px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:720px){.g2,.g3,.g4{grid-template-columns:1fr}}

label.f{display:block;margin-bottom:10px}
label.f>span{display:block;font-size:11px;font-weight:640;color:var(--ink-2);margin-bottom:3px}
label.f .rq{color:var(--stop)}
input[type=text],input[type=email],input[type=tel],input[type=date],input[type=time],input[type=number],input[type=search],select,textarea{
  width:100%;padding:6px 9px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface)}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent-2);outline:2px solid var(--accent-soft)}
.bad{border-color:var(--stop)!important;background:var(--stop-soft)}
.msg{display:none;color:var(--stop);font-size:11.5px;margin-top:3px}
.msg.on{display:block}
.hint{font-size:11px;color:var(--ink-3);margin-top:3px}
.chk{display:flex;gap:6px;align-items:center;font-size:12.5px;padding:3px 0}
.chk input{width:auto}

.tw{overflow:auto;border:1px solid var(--line);border-radius:var(--r2);background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{position:sticky;top:0;background:var(--surface-2);text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);
   font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap;font-weight:700}
th button{background:none;border:0;padding:0;cursor:pointer;font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit}
td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tr.daybreak td{background:var(--surface-3);font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);cursor:default}
tr.daybreak:hover td{background:var(--surface-3)}

.bdg{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 6px;border-radius:3px;border:1px solid;white-space:nowrap}
.b-ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.b-warn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.b-stop{background:var(--stop-soft);color:var(--stop);border-color:var(--stop)}
.b-info{background:var(--info-soft);color:var(--info);border-color:var(--info)}
.b-live{background:var(--live-soft);color:var(--live);border-color:var(--live)}
.b-grey{background:var(--surface-3);color:var(--ink-2);border-color:var(--line-2)}

.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:10px 12px;text-align:left;cursor:pointer;box-shadow:var(--shadow)}
.stat:hover{border-color:var(--accent)}
.stat .v{font:700 22px/1.1 var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat .k{font-size:11.5px;color:var(--ink-2);margin-top:3px}
.stat .x{font-size:10.5px;color:var(--ink-3)}
.stat.warn .v{color:var(--warn)} .stat.stop .v{color:var(--stop)} .stat.ok .v{color:var(--ok)} .stat.live .v{color:var(--live)}

/* ---- SIGNATURE: dispatch readiness ---- */
.ready{border:1px solid;border-left-width:5px;border-radius:var(--r2);padding:11px 14px;display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.ready.ok{background:var(--ok-soft);border-color:var(--ok)}
.ready.warn{background:var(--warn-soft);border-color:var(--warn)}
.ready.stop{background:var(--stop-soft);border-color:var(--stop)}
.ready .verdict{font-weight:750;font-size:14.5px}
.ready.ok .verdict{color:var(--ok)} .ready.warn .verdict{color:var(--warn)} .ready.stop .verdict{color:var(--stop)}
.ready ul{margin:5px 0 0;padding-left:16px;font-size:12px}
.ready li{margin-bottom:2px}

.facts{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;background:var(--surface)}
.facts>div{flex:1 1 130px;padding:9px 12px;border-right:1px solid var(--line)}
.facts>div:last-child{border-right:0}
.facts .k{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.facts .v{margin-top:3px;font-size:13px;font-weight:600}

/* journey leg */
.leg{display:flex;gap:12px;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:13px}
.leg .pt{flex:1 1 220px;min-width:0}
.leg .pt .k{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.leg .pt .t{font:700 17px/1.2 var(--mono);margin-top:3px}
.leg .pt .a{font-size:12.5px;color:var(--ink-2);margin-top:3px}
.leg .arrow{flex:0 0 60px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink-3)}
.leg .arrow .d{font:600 11px var(--mono)}
.leg .arrow .line{width:100%;height:1px;background:var(--line-2);margin:5px 0;position:relative}
.leg .arrow .line::after{content:"";position:absolute;right:0;top:-3px;border-left:6px solid var(--line-2);border-top:3.5px solid transparent;border-bottom:3.5px solid transparent}

/* status rail */
.rail{display:flex;gap:2px;flex-wrap:wrap;margin-top:10px}
.rail .s{flex:1 1 0;min-width:76px;background:var(--surface-2);border:1px solid var(--line);border-radius:3px;padding:5px 7px}
.rail .s.done{background:var(--accent-soft);border-color:var(--accent)}
.rail .s.now{background:var(--accent);border-color:var(--accent)}
.rail .s.now .n,.rail .s.now .t{color:#fff}
.rail .s.dead{background:var(--stop-soft);border-color:var(--stop)}
.rail .s.dead .n{color:var(--stop)}
.rail .n{font-size:10px;font-weight:700;line-height:1.25}
.rail .t{font:10px var(--mono);color:var(--ink-3)}

/* requirement flags */
.flags{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.flag{font-size:11px;font-weight:650;padding:3px 7px;border-radius:3px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink-2)}
.flag.on{background:var(--info-soft);color:var(--info);border-color:var(--info)}
.flag.alert{background:var(--stop-soft);color:var(--stop);border-color:var(--stop)}

.alertbox{border:1px solid var(--stop);background:var(--stop-soft);color:var(--stop);border-radius:var(--r2);padding:10px 13px;margin-bottom:12px}
.alertbox b{display:block;font-size:12px;letter-spacing:.04em;text-transform:uppercase;margin-bottom:4px}
.alertbox ul{margin:0;padding-left:16px;font-size:12.5px}

.tabs{display:flex;gap:1px;border-bottom:1px solid var(--line);overflow:auto;background:var(--surface);border-radius:var(--r2) var(--r2) 0 0;padding:0 6px}
.tab{background:none;border:0;padding:9px 12px;cursor:pointer;color:var(--ink-2);border-bottom:2px solid transparent;font-weight:550;white-space:nowrap;font-size:12.5px}
.tab[aria-selected="true"]{color:var(--accent-2);border-bottom-color:var(--accent-2)}

dl.kv{display:grid;grid-template-columns:172px 1fr;gap:6px 14px;margin:0}
dl.kv dt{font-size:11px;color:var(--ink-3);font-weight:650}
dl.kv dd{margin:0}
@media(max-width:640px){dl.kv{grid-template-columns:1fr;gap:1px}dl.kv dd{margin-bottom:7px}}

ul.feed{list-style:none;margin:0;padding:0}
ul.feed li{padding:8px 0 8px 13px;border-left:2px solid var(--line-2);position:relative}
ul.feed li::before{content:"";position:absolute;left:-4px;top:12px;width:6px;height:6px;border-radius:50%;background:var(--accent-2)}
ul.feed .m{font-size:11px;color:var(--ink-3);font-family:var(--mono)}
ul.feed .s{font-weight:600;margin-top:2px}
ul.feed .d{margin-top:2px;white-space:pre-wrap;color:var(--ink-2)}

.inline{background:var(--surface-2);border:1px dashed var(--line-2);border-radius:var(--r2);padding:11px;margin-top:12px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1 1 140px}
.empty{padding:34px 16px;text-align:center;color:var(--ink-2)}
.empty b{display:block;color:var(--ink);font-size:14px;margin-bottom:4px}

/* wizard */
.steps{display:flex;gap:0;border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;background:var(--surface);margin-bottom:12px}
.steps .st{flex:1;padding:9px 12px;border-right:1px solid var(--line);font-size:11.5px;color:var(--ink-3);display:flex;gap:8px;align-items:center}
.steps .st:last-child{border-right:0}
.steps .st .n{width:20px;height:20px;flex:0 0 20px;border-radius:50%;background:var(--surface-3);color:var(--ink-2);display:grid;place-items:center;font:700 10.5px var(--mono)}
.steps .st.done{color:var(--ink-2)}
.steps .st.done .n{background:var(--ok);color:#fff}
.steps .st.now{color:var(--ink);font-weight:650;background:var(--accent-soft)}
.steps .st.now .n{background:var(--accent);color:#fff}

.quote{border:1px solid var(--line);border-radius:var(--r2);overflow:hidden}
.quote table{font-size:12.5px}
.quote tfoot td{font-weight:700;background:var(--surface-2);border-top:2px solid var(--line-2)}

#toasts{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:6px;align-items:center}
.toast{background:var(--nav);color:#fff;padding:8px 14px;border-radius:18px;font-size:12.5px;box-shadow:var(--shadow)}
.toast.ok{background:var(--ok)} .toast.bad{background:var(--stop)}

.scrim{position:fixed;inset:0;background:rgba(10,16,22,.55);z-index:60}
.modal{position:fixed;z-index:61;top:50%;left:50%;transform:translate(-50%,-50%);width:min(580px,94vw);max-height:88vh;overflow:auto;
  background:var(--bg);border:1px solid var(--line);border-radius:var(--r2);box-shadow:var(--shadow)}
.modal .mh{padding:12px 15px;border-bottom:1px solid var(--line);background:var(--surface);display:flex;align-items:center;gap:10px}
.modal .mb{padding:15px}
.modal .mf{padding:11px 15px;border-top:1px solid var(--line);background:var(--surface);display:flex;gap:8px;justify-content:flex-end}

.demo{background:var(--warn-soft);border:1px solid var(--warn);color:var(--warn);border-radius:var(--r);padding:6px 11px;font-size:11.5px;font-weight:650;margin-bottom:12px}
.deny{max-width:560px;margin:60px auto;text-align:center}

.sidetoggle{display:none}
@media(max-width:920px){
  .side{position:fixed;z-index:70;transform:translateX(-100%);transition:transform .16s}
  .side.open{transform:none}
  .sidetoggle{display:inline-flex}
  .page{padding:12px}
  .steps{display:none}
}
@media print{.side,.bar,.mf,.inline{display:none}.page{padding:0}}
</style>

<div class="shell">
  <nav class="side" id="side" aria-label="Main navigation">
    <div class="logo"><div class="sq" aria-hidden="true">PT</div>
      <div><b>Ambulance &amp; PTS</b><small>Management System</small></div></div>
    <div class="menu" id="menu"></div>
    <div class="sfoot">Demonstration build · Bookings module<br>Branding is placeholder</div>
  </nav>
  <div class="body">
    <header class="bar">
      <button class="btn g sidetoggle" id="sidetoggle" aria-label="Show navigation">☰</button>
      <div class="search"><input id="gsearch" type="search" placeholder="Search bookings, patients, references…" aria-label="Search bookings"></div>
      <div class="spacer"></div>
      <button class="bell" id="bell" aria-label="Bookings needing attention">🔔<b id="bellcount">0</b></button>
      <div class="role"><span class="micro">Role</span> <select id="rolepick" aria-label="Signed-in role"></select></div>
      <button class="btn g" id="theme" aria-label="Switch theme" title="Switch theme">◐</button>
    </header>
    <div class="page" id="page"></div>
  </div>
</div>
<div id="modalhost"></div>
<div id="toasts" aria-live="polite"></div>

<script>
(function(){
"use strict";

/* ============================================================
   BOOKINGS — journey booking, pricing and lifecycle
   Ambulance & Patient Transport Management System
   Consumes: customer accounts + rate cards from the CRM module
   Hands off to: CAD and Dispatch
   ============================================================ */

const KEY="pts:bookings:v1", CRM_KEY="pts:crm:v1";

/* ---------- reference data ---------- */
const BOOKING_TYPES=["Non-emergency patient transport","Hospital appointment","Hospital discharge",
  "Inter-hospital transfer","Care-home transfer","Planned ambulance transport","Bariatric transport",
  "Wheelchair transport","Stretcher transport","Event medical cover","Private ambulance booking"];

const JOURNEY_SHAPES=["One-way","Return","Multi-destination"];
const PRIORITIES=["Routine","Standard","Urgent","Time-critical"];
const VEHICLE_TYPES=["PTS car","Wheelchair-accessible vehicle","Stretcher ambulance","A&E-equipped ambulance","Bariatric ambulance","Event response vehicle"];
const CREW_GRADES=["Driver only","Ambulance Care Assistant","Emergency Medical Technician","Paramedic","Nurse escort"];
const MOBILITY=["Walking, unaided","Walking, needs assistance","Walking frame","Own wheelchair","Our wheelchair","Carry chair","Stretcher","Bariatric stretcher"];
const CLINICAL_NEEDS=["None","Oxygen","Suction","Observation monitoring","Paramedic escort","Nurse escort","Syringe driver","Catheter or drain"];
const IPC=["None","Contact precautions","Droplet precautions","Airborne precautions","MRSA","C. difficile","Deep clean required after journey"];

const FLOW=["Draft","Awaiting Approval","Confirmed","Unallocated","Allocated","Dispatched","Crew Mobile",
  "At Collection","Patient On Board","At Destination","Handover in Progress","Completed"];
const OUTCOMES=["Cancelled","Aborted","No Access","Patient Not Ready","Patient Refused Transport"];

const CANCEL_REASONS=["Patient cancelled","Customer cancelled","Hospital cancelled the appointment",
  "Transport no longer required","Patient admitted","Patient deceased","Duplicate booking","Booked in error",
  "No capacity — unable to cover","Vehicle breakdown","Adverse weather or major incident"];
const ABORT_REASONS=["Patient not fit to travel","Clinical escalation — 999 called","Patient unsafe to transport",
  "Equipment failure","Crew unable to gain access","Receiving unit refused handover","Patient declined at the door"];

const ROLES=[
  {id:"super",   name:"Super Administrator",         p:["view","create","edit","approve","price","cancel","status","audit"]},
  {id:"director",name:"Company Director",            p:["view","create","edit","approve","price","cancel","status","audit"]},
  {id:"ops",     name:"Operations Manager",          p:["view","create","edit","approve","price","cancel","status","audit"]},
  {id:"dispatch",name:"Control Room Dispatcher",     p:["view","create","edit","cancel","status"]},
  {id:"clinical",name:"Clinical Lead",               p:["view","audit"]},
  {id:"para",    name:"Paramedic",                   p:["view.today"]},
  {id:"emt",     name:"Emergency Medical Technician",p:["view.today"]},
  {id:"aca",     name:"Ambulance Care Assistant",    p:["view.today"]},
  {id:"driver",  name:"Driver",                      p:["view.today"]},
  {id:"event",   name:"Event Medical Staff",         p:["view.today"]},
  {id:"hr",      name:"HR & Compliance Officer",     p:[]},
  {id:"fleet",   name:"Fleet Manager",               p:[]},

/* ============================================================
   PRICING — reads the agreed rate card from the CRM account
   ============================================================ */
function rate(c,item){ const r=(c&&c.rates||[]).find(x=>x.item===item); return r?r.amount:null; }

function baseFareItem(b){
  const m=b.mobility||"";
  if(m.indexOf("Stretcher")===0||m==="Bariatric stretcher") return "Base fare — stretcher";
  if(m.indexOf("wheelchair")>-1||m==="Carry chair") return "Base fare — wheelchair";
  return "Base fare — ambulance care";
}
function isOutOfHours(b){
  if(!b.collectDate||!b.collectTime) return false;
  const h=parseInt(b.collectTime.slice(0,2),10);
  const d=new Date(b.collectDate+"T00:00:00").getDay();
  return h<7||h>=19||d===0||d===6;
}
function price(b){
  const c=cust(b.customerRef);
  const lines=[], notes=[];
  if(!c) return {lines,total:0,notes:["No customer account linked — journey cannot be priced."],priceable:false};
  if(!c.rates||!c.rates.length) return {lines,total:0,notes:["No agreed rate card on the customer account."],priceable:false};

  const item=baseFareItem(b);
  const base=rate(c,item);
  if(base!=null) lines.push({label:item,detail:"1 journey",amount:base});
  else notes.push("No agreed base fare for "+item.toLowerCase()+".");

  const perMile=rate(c,"Per mile");
  if(perMile!=null&&b.mileage>0) lines.push({label:"Mileage",detail:b.mileage+" miles @ "+gbp(perMile),amount:perMile*b.mileage});
  else if(b.mileage>0) notes.push("No agreed mileage rate.");

  const waitH=(b.waitingMins||0)/60;
  const perHour=rate(c,"Waiting time per hour");
  if(perHour!=null&&waitH>0) lines.push({label:"Waiting time",detail:b.waitingMins+" minutes @ "+gbp(perHour)+"/hr",amount:perHour*waitH});

  if(b.mobility==="Bariatric stretcher"||b.type==="Bariatric transport"){
    const bar=rate(c,"Bariatric surcharge");
    if(bar!=null) lines.push({label:"Bariatric surcharge",detail:"Additional crew and equipment",amount:bar});
  }
  if(b.shape==="Return"){
    const rl=lines.filter(l=>l.label!=="Waiting time").reduce((s,l)=>s+l.amount,0);
    lines.push({label:"Return leg",detail:"Second journey at the same rates",amount:rl});
  }

  let sub=lines.reduce((s,l)=>s+l.amount,0);
  const ooh=rate(c,"Out-of-hours uplift");
  if(isOutOfHours(b)&&ooh!=null){ lines.push({label:"Out-of-hours uplift",detail:ooh+"% — collection outside 07:00–19:00 or at a weekend",amount:sub*ooh/100}); }
  const bh=rate(c,"Bank holiday uplift");
  if(b.bankHoliday&&bh!=null){ lines.push({label:"Bank holiday uplift",detail:bh+"%",amount:sub*bh/100}); }

  if(b.status==="Cancelled"&&b.lateCancel){
    const lc=rate(c,"Late cancellation");
    if(lc!=null) return {lines:[{label:"Late cancellation charge",detail:"Cancelled inside 24 hours of collection",amount:lc}],
      total:lc,notes:["Journey charges withdrawn; cancellation charge applied under the agreed rate card."],priceable:true};
  }
  const total=lines.reduce((s,l)=>s+l.amount,0);
  return {lines,total:Math.round(total*100)/100,notes,priceable:lines.length>0};
}

/* ============================================================
   SIGNATURE — dispatch readiness
   Can this booking safely be handed to the control room?
   ============================================================ */
function readiness(b){
  const blocks=[],checks=[];
  const c=cust(b.customerRef), p=pat(b.patientId);

  if(c){
    if(c.creditHold) blocks.push("Customer is on credit hold in the CRM — booking may not be released.");
    if(c.status==="Archived"||c.status==="Inactive") blocks.push("Customer account is "+c.status.toLowerCase()+".");
    if(c.contract&&c.contract.end&&days(c.contract.end)<0) blocks.push("Customer contract expired on "+ukd(c.contract.end)+".");
    if(c.contract&&c.contract.poRequired&&!b.poNumber&&!(c.contract.standingPO))
      blocks.push("Purchase order required by this customer — none recorded on the booking.");
  } else blocks.push("No customer account linked.");

  if(!b.patientId&&b.type!=="Event medical cover") blocks.push("No patient linked to the journey.");
  if(!b.fromAddr||!b.toAddr) blocks.push("Collection or destination address is incomplete.");
  if(!b.collectDate||!b.collectTime) blocks.push("Collection date and time not set.");
  if(!b.vehicleType) blocks.push("Required vehicle type not specified.");
  if(!b.crewGrade) blocks.push("Required crew grade not specified.");
  const q=price(b);
  if(!q.priceable) blocks.push("Journey cannot be priced — check the customer rate card.");

  if(b.collectDate&&b.collectTime&&new Date(when(b))<new Date()&&["Draft","Awaiting Approval","Confirmed"].includes(b.status))
    checks.push("Collection time is in the past.");
  if(p){
    if(p.alerts.some(a=>a.k==="Safeguarding")&&!b.riskAssessed) checks.push("Patient carries a safeguarding alert and no risk assessment is recorded.");
    if(p.alerts.some(a=>a.k==="Behavioural")&&!b.riskAssessed) checks.push("Patient carries a behavioural alert and no risk assessment is recorded.");
    if(p.alerts.some(a=>a.k==="Infection")&&(!b.ipc||b.ipc==="None")) checks.push("Patient has an infection-control alert but no precautions recorded on the booking.");
    if(p.mobility&&b.mobility&&p.mobility!==b.mobility) checks.push("Booked mobility ("+b.mobility+") differs from the patient record ("+p.mobility+").");
  }
  const need=b.clinical||"None";
  const gi=CREW_GRADES.indexOf(b.crewGrade||"");
  if((need==="Paramedic escort")&&gi<CREW_GRADES.indexOf("Paramedic")) blocks.push("Journey needs a paramedic escort — booked crew grade is lower.");
  if((need==="Nurse escort")&&b.crewGrade!=="Nurse escort") blocks.push("Journey needs a nurse escort — booked crew grade does not match.");
  if((need==="Oxygen"||need==="Suction"||need==="Observation monitoring")&&gi<CREW_GRADES.indexOf("Ambulance Care Assistant"))
    blocks.push("Clinical need of "+need.toLowerCase()+" requires at least an Ambulance Care Assistant.");
  if(b.mobility==="Stretcher"&&["PTS car","Wheelchair-accessible vehicle"].includes(b.vehicleType))
    blocks.push("Stretcher patient booked onto a vehicle that cannot carry a stretcher.");
  if(b.mobility==="Bariatric stretcher"&&b.vehicleType!=="Bariatric ambulance")
    blocks.push("Bariatric patient must be booked onto a bariatric ambulance.");

  if(b.shape==="Return"&&!b.returnTime) checks.push("Return journey has no return time — dispatch cannot plan the second leg.");
  if(!b.mileage) checks.push("No mileage recorded — the price may be understated.");
  if(b.type==="Bariatric transport"&&!b.instructions) checks.push("Bariatric journey with no access or handling instructions.");
  if(b.staffCount<2&&(b.mobility==="Stretcher"||b.mobility==="Bariatric stretcher")) checks.push("Stretcher journeys normally need at least two crew.");

  const level=blocks.length?"stop":checks.length?"warn":"ok";
  return {level,blocks,checks,
    verdict:level==="stop"?"Not ready for dispatch":level==="warn"?"Ready with checks":"Ready for dispatch"};
}
const readyBadge=b=>{const r=readiness(b);
  return '<span class="bdg b-'+(r.level==="ok"?"ok":r.level==="warn"?"warn":"stop")+'">'+esc(r.verdict)+'</span>';};

}

      instructions:mob==="Bariatric stretcher"?"Ground floor flat, narrow doorway. Four-person transfer agreed with the family.":"",
      internalNotes:""});
    // walk the status history forward so timestamps look real
    const target=status;
    const path=OUTCOMES.includes(target)?FLOW.slice(0,FLOW.indexOf("Confirmed")+1):FLOW.slice(0,FLOW.indexOf(target)+1);
    const base=new Date(date+"T"+time+":00").getTime()-36e5*20;
    path.forEach((st,i)=>{ b.status=st; b.statusHistory[st]=new Date(base+i*22*6e4).toISOString(); });
    if(OUTCOMES.includes(target)){
      b.status=target; b.statusHistory[target]=new Date(new Date(date+"T"+time+":00").getTime()-18e5).toISOString();
      b.cancelReason=target==="Cancelled"?"Hospital cancelled the appointment":"Patient not ready on arrival — 15 minute wait exceeded";
      b.lateCancel=target==="Cancelled";
      b.outcomeNotes=target==="Cancelled"?"Ward telephoned at 16:40 the previous day.":"Crew waited 15 minutes and stood down after speaking to the home.";
    }
    b.audit.push({id:uid(),at:b.statusHistory[b.status],by:"System",action:"Status changed",detail:"→ "+b.status});
    b.updatedAt=b.statusHistory[b.status];
    S.bookings.push(b);
  });
}

/* ---------- filters ---------- */
function visible(){
  let list=S.bookings.slice();
  if(portalOnly()) list=list.filter(b=>b.customerRef===role().ownCustomer);
  if(crewOnly()) list=list.filter(b=>b.collectDate===todayISO()&&!["Draft","Awaiting Approval"].includes(b.status));
  const f=S.f,q=f.q.trim().toLowerCase();
  list=list.filter(b=>{
    if(f.from&&b.collectDate<f.from) return false;
    if(f.to&&b.collectDate>f.to) return false;
    if(f.type&&b.type!==f.type) return false;
    if(f.customer&&b.customerRef!==f.customer) return false;
    if(f.priority&&b.priority!==f.priority) return false;
    if(f.status==="live"&&isClosed(b)) return false;
    else if(f.status==="progress"&&!inProgress(b)) return false;
    else if(f.status==="unallocated"&&b.status!=="Unallocated") return false;
    else if(f.status==="closed"&&!isClosed(b)) return false;
    else if(f.status&&!["live","progress","unallocated","closed",""].includes(f.status)&&b.status!==f.status) return false;
    if(f.ready&&readiness(b).level!==f.ready) return false;
    if(q){
      const p=pat(b.patientId), c=cust(b.customerRef);
      const hay=[b.ref,b.type,b.fromAddr,b.toAddr,b.poNumber,c?c.name:"",p?p.forename+" "+p.surname+" "+p.nhs:""].join(" ").toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  const k=S.sort.k,d=S.sort.d==="asc"?1:-1;
  list.sort((a,b)=>{
    let x,y;
    if(k==="collect"){x=when(a);y=when(b);}
    else if(k==="price"){x=price(a).total;y=price(b).total;}
    else if(k==="customer"){x=(cust(a.customerRef)||{}).name||"";y=(cust(b.customerRef)||{}).name||"";}
    else if(k==="patient"){const pa=pat(a.patientId),pb=pat(b.patientId);x=pa?pa.surname:"";y=pb?pb.surname:"";}
    else {x=String(a[k]||"").toLowerCase();y=String(b[k]||"").toLowerCase();}
    return x<y?-d:x>y?d:0;
  });
  return list;
}

function nextActions(b){
  const out=[];
  if(b.status==="Draft") out.push('<button class="btn p" id="submit">Submit for approval</button>');
  if(b.status==="Awaiting Approval"&&can("approve")) out.push('<button class="btn p" id="approve">Approve &amp; confirm</button>');
  if(b.status==="Awaiting Approval"&&!can("approve")) out.push('<span class="muted">Approval needs a manager.</span>');
  if(b.status==="Confirmed") out.push('<button class="btn p" id="todispatch">Send to dispatch</button>');
  const i=FLOW.indexOf(b.status);
  if(i>=FLOW.indexOf("Unallocated")&&i<FLOW.length-1&&can("status"))
    out.push('<button class="btn" id="advance">Mark '+esc(FLOW[i+1])+'</button>');
  if(!isClosed(b)&&can("cancel")){
    out.push('<button class="btn danger" id="cancel">Cancel</button>');
    if(i>=FLOW.indexOf("Dispatched")) out.push('<button class="btn danger" id="abort">Record outcome</button>');
  }
  return out.join(" ");
}

      '<button class="btn p xs" id="save-req">Save requirements</button></div>':'');

  if(S.tab==="pricing"){
    const q=price(b);

  if(S.tab==="stops"){

        (can("edit")?'<td class="r"><button class="btn xs g" data-rmstop="'+s.id+'">Remove</button></td>':'')+'</tr>').join("")+
      '</tbody></table></div>'
      :'<div class="empty"><b>No intermediate stops</b>Multi-destination journeys collect additional stops here — pharmacy, second patient, or a drop-off on the way.</div>')+

  if(S.tab==="notes"){

      (b.attachments.length?'<div class="tw" style="border:0"><table><thead><tr><th>File</th><th>Size</th><th>Added</th>'+
        (can("edit")?'<th></th>':'')+'</tr></thead><tbody>'+
        b.attachments.map(a=>'<tr style="cursor:default"><td>'+esc(a.name)+'</td><td class="num muted">'+esc(a.size)+'</td>'+

  return '<ul class="feed">'+b.audit.slice().sort((x,y)=>y.at.localeCompare(x.at)).map(a=>
    '<li><div class="m">'+uks(a.at)+' · '+esc(a.by)+'</div><div class="s">'+esc(a.action)+'</div>'+
    (a.detail?'<div class="d">'+esc(a.detail)+'</div>':'')+'</li>').join("")+'</ul>'+

      '<label class="f"><span>Booking type<span class="rq">*</span></span><select id="w-type">'+

function go(v){S.view=v;S.selected=null;render();window.scrollTo(0,0);$("#side").classList.remove("open");}
function openB(id){
  if(portalOnly()){const b=S.bookings.find(x=>x.id===id);
    if(!b||b.customerRef!==role().ownCustomer){toast("Your portal account can only see its own journeys.","bad");return;}}
  S.selected=id;S.view="booking";S.tab="journey";render();window.scrollTo(0,0);
}
const val=id=>{const e=document.getElementById(id);return e?e.value.trim():"";};
const num=id=>{const e=document.getElementById(id);return e?parseFloat(e.value)||0:0;};
const chk=id=>{const e=document.getElementById(id);return e?e.checked:false;};
function mark(id,mid,ok){const e=document.getElementById(id),m=document.getElementById(mid);
  if(e)e.classList.toggle("bad",!ok);if(m)m.classList.toggle("on",!ok);return ok;}

/* capture wizard fields before changing step */
function grabStep(){
  const d=S.draft; if(!d) return;
  if(S.step===1){ if($("#w-customer"))d.customerRef=$("#w-customer").value; if($("#w-patient"))d.patientId=$("#w-patient").value; }
  if(S.step===2){
    d.type=val("w-type")||d.type; d.shape=val("w-shape")||d.shape; d.priority=val("w-priority")||d.priority;
    d.fromAddr=val("w-from"); d.toAddr=val("w-to"); d.fromNotes=val("w-fromnotes"); d.toNotes=val("w-tonotes");
    d.collectDate=val("w-date"); d.collectTime=val("w-time"); d.appointmentTime=val("w-appt"); d.returnTime=val("w-return");
    d.mileage=num("w-mileage"); d.waitingMins=num("w-wait"); d.bankHoliday=chk("w-bh");
  }
  if(S.step===3){
    d.mobility=val("w-mob"); d.vehicleType=val("w-veh"); d.crewGrade=val("w-crew");
    d.staffCount=num("w-staff")||1; d.clinical=val("w-clin"); d.ipc=val("w-ipc");
    d.escort=val("w-escort"); d.instructions=val("w-instr"); d.riskAssessed=chk("w-risk"); d.riskNotes=val("w-risknotes");
  }
  if(S.step===4){ d.poNumber=val("w-po"); d.internalNotes=val("w-notes"); }
}
function validateStep(){
  const d=S.draft;
  if(S.step===1){
    if(!mark("w-customer","m-w-customer",!!d.customerRef)) return false;
    const c=cust(d.customerRef);
    if(c&&(c.creditHold||c.status==="Inactive"||c.status==="Archived"||(c.contract&&c.contract.end&&days(c.contract.end)<0))){
      toast("This customer is blocked in the CRM — the booking cannot proceed.","bad"); return false; }
    return true;
  }
  if(S.step===2){
    let ok=true;
    ok=mark("w-from","m-w-from",!!d.fromAddr)&&ok;
    ok=mark("w-to","m-w-to",!!d.toAddr)&&ok;
    ok=mark("w-date","m-w-date",!!d.collectDate)&&ok;
    ok=mark("w-time","m-w-time",!!d.collectTime)&&ok;
    if(!ok) toast("Check the highlighted fields.","bad");
    return ok;
  }
  if(S.step===3){
    let ok=true;
    ok=mark("w-mob","m-w-mob",!!d.mobility)&&ok;
    ok=mark("w-veh","m-w-veh",!!d.vehicleType)&&ok;
    ok=mark("w-crew","m-w-crew",!!d.crewGrade)&&ok;
    if(!ok) toast("Check the highlighted fields.","bad");
    return ok;
  }
  if(S.step===4){
    const c=cust(d.customerRef);
    if(c&&c.contract&&c.contract.poRequired&&!c.contract.standingPO)
      return mark("w-po","m-w-po",!!d.poNumber);
    return true;
  }
  return true;
}

document.addEventListener("click", async e=>{
  const t=e.target.closest("[data-go],[data-open],[data-tab],[data-sort],[data-stat],[data-mclose],[data-rmstop],[data-rmfile],[data-cancelseries],button");
  if(!t) return;
  const b=S.bookings.find(x=>x.id===S.selected);

  if(t.dataset.mclose){closeModal();return;}
  if(t.dataset.go){const m=MENU.find(x=>x.id===t.dataset.go);
    if(t.dataset.go==="newbooking"){S.draft=blank();S.step=1;}
    if(m&&!m.live){S.view=t.dataset.go;S.selected=null;render();$("#side").classList.remove("open");return;}
    go(t.dataset.go);return;}
  if(t.dataset.open){openB(t.dataset.open);return;}
  if(t.dataset.tab){S.tab=t.dataset.tab;render();return;}
  if(t.dataset.sort){const k=t.dataset.sort;S.sort=S.sort.k===k?{k,d:S.sort.d==="asc"?"desc":"asc"}:{k,d:"asc"};render();return;}
  if(t.dataset.stat!==undefined&&t.classList.contains("stat")){
    const presets=[{from:todayISO(),to:todayISO(),status:""},{status:"unallocated"},{status:"progress"},
      {status:"live",ready:"stop"},{status:"Awaiting Approval"},{status:"closed"}];
    S.f=Object.assign({q:"",from:"",to:"",status:"",type:"",customer:"",priority:"",ready:""},presets[+t.dataset.stat]);
    go("bookings");return;
  }
  if(t.dataset.cancelseries){
    const gid=t.dataset.cancelseries;
    const list=S.bookings.filter(x=>x.recurringId===gid&&!isClosed(x)&&days(x.collectDate)>=0);
    list.forEach(x=>{x.cancelReason="Series cancelled";setStatus(x,"Cancelled","series cancellation");});
    await save();toast("Cancelled "+list.length+" future journeys","ok");render();return;
  }

  const id=t.id;
  if(id==="theme"){const n=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";
    document.documentElement.setAttribute("data-theme",n);
    try{if(window.storage)window.storage.set("pts:theme",n);}catch(_){}return;}
  if(id==="sidetoggle"){$("#side").classList.toggle("open");return;}
  if(id==="bell"){S.f=Object.assign({q:"",from:"",to:"",status:"live",type:"",customer:"",priority:"",ready:"stop"});go("bookings");return;}
  if(id==="f-clear"){S.f={q:"",from:"",to:"",status:"live",type:"",customer:"",priority:"",ready:""};render();return;}
  if(id==="printlist"){window.print();return;}
  if(id==="export"){exportCSV();return;}

  /* wizard */
  if(id==="w-next"){grabStep();if(!validateStep())return;S.step++;render();window.scrollTo(0,0);return;}
  if(id==="w-back"){grabStep();S.step--;render();window.scrollTo(0,0);return;}
  if(id==="w-cancel"){S.draft=null;S.step=1;go("bookings");return;}
  if(id==="w-save"){
    grabStep();
    const d=S.draft;
    let status="Draft";
    if($("#save-confirm")&&$("#save-confirm").checked) status="Confirmed";
    if($("#save-approval")&&$("#save-approval").checked) status="Awaiting Approval";
    if(can("request")) status="Awaiting Approval";
    const rec=commit(Object.assign({},d,{status}));
    if(status!=="Draft") rec.statusHistory={Draft:rec.createdAt}, rec.statusHistory[status]=rec.createdAt;
    S.bookings.unshift(rec);
    log(rec,"Saved as "+status, price(rec).priceable?("Quoted "+gbp(price(rec).total)):"Not priced");
    await save();S.draft=null;S.step=1;
    toast("Created "+rec.ref+" ("+status+")","ok");openB(rec.id);return;
  }

  /* recurring */
  if(id==="r-preview"||id==="r-create"){
    let ok=true;
    ok=mark("r-customer","m-r-customer",!!val("r-customer"))&&ok;
    ok=mark("r-patient","m-r-patient",!!val("r-patient"))&&ok;
    ok=mark("r-from","m-r-from",!!val("r-from"))&&ok;
    ok=mark("r-to","m-r-to",!!val("r-to"))&&ok;
    ok=mark("r-end","m-r-end",val("r-end")>val("r-start"))&&ok;
    if(!ok){toast("Check the highlighted fields.","bad");return;}
    const wanted=Array.from(document.querySelectorAll(".rday:checked")).map(x=>+x.value);
    if(!wanted.length){toast("Select at least one day of the week.","bad");return;}
    const dates=[];
    const d0=new Date(val("r-start")+"T00:00:00"), d1=new Date(val("r-end")+"T00:00:00");
    for(let d=new Date(d0); d<=d1 && dates.length<200; d.setDate(d.getDate()+1))
      if(wanted.includes(d.getDay())) dates.push(d.toISOString().slice(0,10));
    if(id==="r-preview"){
      $("#r-out").innerHTML='<div class="card"><div class="b"><strong>'+dates.length+' journeys</strong> would be created:'+
        '<div class="hint" style="margin-top:6px">'+dates.map(x=>dayName(x).slice(0,3)+" "+ukd(x)).join(" · ")+'</div></div></div>';
      return;
    }
    const gid="SER-"+Math.random().toString(36).slice(2,7).toUpperCase();
    const status=chk("r-confirm")?"Confirmed":"Draft";
    dates.forEach(dt=>{
      const rec=commit({customerRef:val("r-customer"),patientId:val("r-patient"),type:val("r-type"),shape:"Return",
        fromAddr:val("r-from"),toAddr:val("r-to"),collectDate:dt,collectTime:val("r-time"),returnTime:val("r-return"),
        mobility:val("r-mob"),vehicleType:val("r-veh"),crewGrade:val("r-crew"),mileage:num("r-mileage"),
        staffCount:1,status,recurringId:gid});
      rec.statusHistory={};rec.statusHistory[status]=rec.createdAt;
      log(rec,"Created from series",gid);
      S.bookings.push(rec);
    });
    await save();
    $("#r-out").innerHTML="";
    toast("Created "+dates.length+" journeys in series "+gid,"ok");
    S.f={q:"",from:dates[0],to:dates[dates.length-1],status:"",type:"",customer:val("r-customer"),priority:"",ready:""};
    go("bookings");return;
  }

  if(!b) return;

  /* status actions */
  if(id==="submit"){setStatus(b,"Awaiting Approval");await save();toast("Submitted for approval","ok");render();return;}
  if(id==="approve"){
    if(!can("approve")){toast("Approval needs a manager.","bad");return;}
    const r=readiness(b);
    if(r.level==="stop"){toast("Cannot confirm — "+r.blocks[0],"bad");return;}
    setStatus(b,"Confirmed","approved by "+role().name);await save();toast("Booking confirmed","ok");render();return;
  }
  if(id==="todispatch"){
    const r=readiness(b);
    if(r.level==="stop"){toast("Not ready for dispatch — "+r.blocks[0],"bad");return;}
    setStatus(b,"Unallocated","released to the dispatch queue");await save();toast("Sent to the dispatch queue","ok");render();return;
  }
  if(id==="advance"){
    const i=FLOW.indexOf(b.status);
    if(i<0||i>=FLOW.length-1) return;
    setStatus(b,FLOW[i+1],"recorded manually in Bookings");await save();render();return;
  }
  if(id==="cancel"){modalCancel(b);return;}
  if(id==="abort"){modalAbort(b);return;}
  if(id==="cx-do"){
    if(!mark("cx-reason","m-cx-reason",!!val("cx-reason"))) return;
    b.cancelReason=val("cx-reason");b.outcomeNotes=val("cx-notes");
    b.lateCancel=$("#cx-charge")?$("#cx-charge").checked:false;
    setStatus(b,"Cancelled",b.cancelReason+(b.lateCancel?" · late cancellation charge applied":""));
    await save();closeModal();toast("Booking cancelled","ok");render();return;
  }
  if(id==="ab-do"){
    let ok=true;
    ok=mark("ab-reason","m-ab-reason",!!val("ab-reason"))&&ok;
    ok=mark("ab-notes","m-ab-notes",val("ab-notes").length>=15)&&ok;
    if(!ok) return;
    b.cancelReason=val("ab-reason");b.outcomeNotes=val("ab-notes");
    setStatus(b,val("ab-status"),b.cancelReason);
    await save();closeModal();toast("Outcome recorded","ok");render();return;
  }

  /* edits */
  if(id==="save-journey"){
    const ch=[];
    const nd=val("e-date"),nt=val("e-time");
    if(nd!==b.collectDate||nt!==b.collectTime){ch.push("collection "+ukd(b.collectDate)+" "+b.collectTime+" → "+ukd(nd)+" "+nt);b.collectDate=nd;b.collectTime=nt;}
    const map={appointmentTime:"e-appt",returnTime:"e-return",poNumber:"e-po"};
    Object.entries(map).forEach(([k,el])=>{const v=val(el);if(v!==b[k]){ch.push(k+" updated");b[k]=v;}});
    const mi=num("e-mileage"),wt=num("e-wait");
    if(mi!==b.mileage){ch.push("mileage "+b.mileage+" → "+mi);b.mileage=mi;}
    if(wt!==b.waitingMins){ch.push("waiting "+b.waitingMins+" → "+wt+" mins");b.waitingMins=wt;}
    if(!ch.length){toast("Nothing to save.");return;}
    log(b,"Journey updated",ch.join("; "));await save();toast("Saved","ok");render();return;
  }
  if(id==="save-req"){
    const ch=[];
    const set=(k,el,label)=>{const v=val(el);if(v!==b[k]){ch.push(label+": "+(b[k]||"—")+" → "+v);b[k]=v;}};
    set("mobility","e-mob","mobility");set("vehicleType","e-veh","vehicle");set("crewGrade","e-crew","crew grade");
    set("clinical","e-clin","clinical");set("ipc","e-ipc","infection control");set("escort","e-escort","escort");
    const st=num("e-staff");if(st!==b.staffCount){ch.push("staff "+b.staffCount+" → "+st);b.staffCount=st;}
    const rk=chk("e-risk");if(rk!==b.riskAssessed){ch.push(rk?"risk assessment recorded":"risk assessment removed");b.riskAssessed=rk;}
    const rn=val("e-risknotes");if(rn!==b.riskNotes){ch.push("risk notes updated");b.riskNotes=rn;}
    const ins=val("e-instr");if(ins!==b.instructions){ch.push("crew instructions updated");b.instructions=ins;}
    if(!ch.length){toast("Nothing to save.");return;}
    log(b,"Requirements updated",ch.join("; "));await save();toast("Saved","ok");render();return;
  }
  if(id==="save-price"){
    const v=$("#e-override").value.trim();
    b.bankHoliday=chk("e-bh");
    if(v===""){log(b,"Pricing updated","bank holiday "+(b.bankHoliday?"applied":"removed"));await save();render();return;}
    if(!mark("e-overreason","m-overreason",!!val("e-overreason"))) return;
    const before=price(b).total;
    b.priceOverride=Math.round(parseFloat(v)*100)/100;
    log(b,"Price overridden",gbp(before)+" → "+gbp(b.priceOverride)+" · "+val("e-overreason"));
    await save();toast("Price override applied","ok");render();return;
  }
  if(id==="clear-override"){
    const was=b.priceOverride;b.priceOverride=null;
    log(b,"Price override removed","was "+gbp(was));await save();render();return;
  }
  if(id==="add-stop"){
    if(!mark("st-addr","m-st-addr",!!val("st-addr"))) return;
    b.stops.push({id:uid(),addr:val("st-addr"),purpose:val("st-purpose"),time:val("st-time")});
    if(b.shape!=="Multi-destination"){b.shape="Multi-destination";log(b,"Journey shape changed","→ Multi-destination");}
    log(b,"Stop added",val("st-addr"));await save();toast("Stop added","ok");render();return;
  }
  if(t.dataset.rmstop){
    const s=b.stops.find(x=>x.id===t.dataset.rmstop);
    b.stops=b.stops.filter(x=>x.id!==t.dataset.rmstop);
    log(b,"Stop removed",s?s.addr:"");await save();render();return;
  }
  if(id==="save-notes"){
    const v=$("#e-notes").value;
    if(v===b.internalNotes){toast("Nothing to save.");return;}
    b.internalNotes=v;log(b,"Internal notes updated","");await save();toast("Saved","ok");render();return;
  }
  if(id==="add-file"){
    const f=$("#e-file").files[0];
    if(!f){toast("Choose a file first.","bad");return;}
    b.attachments.push({id:uid(),name:f.name,size:(f.size/1024).toFixed(0)+" KB",by:role().name,at:new Date().toISOString()});
    log(b,"Attachment added",f.name);await save();toast("Attached "+f.name,"ok");render();return;
  }
  if(t.dataset.rmfile){
    const f=b.attachments.find(x=>x.id===t.dataset.rmfile);
    b.attachments=b.attachments.filter(x=>x.id!==t.dataset.rmfile);
    log(b,"Attachment removed",f?f.name:"");await save();render();return;
  }
});

document.addEventListener("change", e=>{
  const el=e.target;
  if(el.id==="rolepick"){S.roleId=el.value;S.selected=null;S.draft=null;S.step=1;
    if(!can("view")&&!can("view.today")&&!can("view.own"))S.view="bookings";
    else S.view="bookings";
    render();toast("Signed in as "+role().name);return;}
  if(el.id==="w-customer"||el.id==="w-patient"){grabStep();render();return;}
  const map={"f-status":"status","f-type":"type","f-customer":"customer","f-ready":"ready","f-from":"from","f-to":"to","f-priority":"priority"};
  if(map[el.id]){S.f[map[el.id]]=el.value;render();return;}
});

let tm;
document.addEventListener("input", e=>{
  if(e.target.id!=="f-q"&&e.target.id!=="gsearch") return;
  const g=e.target.id==="gsearch";
  S.f.q=e.target.value;
  clearTimeout(tm);
  tm=setTimeout(()=>{
    const pos=e.target.selectionStart;
    if(g){ if(S.view!=="bookings"){S.f.status="";go("bookings");} else render();
      const x=$("#gsearch");if(x){x.focus();try{x.setSelectionRange(pos,pos);}catch(_){}} }
    else { render(); const x=$("#f-q");if(x){x.focus();try{x.setSelectionRange(pos,pos);}catch(_){}} }
  },220);
});

document.addEventListener("keydown", e=>{
  if(e.key==="Escape"&&$("#modalhost").innerHTML){closeModal();return;}
  if((e.key==="Enter"||e.key===" ")&&e.target.dataset&&e.target.dataset.open){e.preventDefault();openB(e.target.dataset.open);}
});

/* ---------- export ---------- */
function exportCSV(){
  const rows=visible();
  if(!rows.length){toast("Nothing to export with these filters.","bad");return;}
  const head=["Job","Status","Collection date","Collection time","Patient","NHS number","Customer","PO",
    "Type","Shape","Priority","From","To","Vehicle","Crew grade","Staff","Mobility","Clinical","Infection control",
    "Mileage","Waiting mins","Dispatch readiness","Cancellation reason"];
  if(can("price")) head.push("Price");
  const q=v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"';
  const body=rows.map(b=>{
    const p=pat(b.patientId),c=cust(b.customerRef),pr=price(b);
    const line=[b.ref,b.status,ukd(b.collectDate),b.collectTime,p?p.forename+" "+p.surname:"",p?p.nhs:"",
      c?c.name:"",b.poNumber,b.type,b.shape,b.priority,b.fromAddr,b.toAddr,b.vehicleType,b.crewGrade,b.staffCount,
      b.mobility,b.clinical,b.ipc,b.mileage,b.waitingMins,readiness(b).verdict,b.cancelReason];
    if(can("price")) line.push((b.priceOverride!=null?b.priceOverride:pr.total).toFixed(2));
    return line.map(q).join(",");
  }).join("\r\n");
  const csv="\ufeff"+head.map(q).join(",")+"\r\n"+body;
  const url=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
  const a=document.createElement("a");a.href=url;a.download="bookings-"+todayISO()+".csv";
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),800);
  toast("Exported "+rows.length+" journeys","ok");
}

/* ---------- boot ---------- */

  $("#rolepick").innerHTML=ROLES.map(r=>'<option value="'+r.id+'"'+(r.id===S.roleId?' selected':'')+'>'+esc(r.name)+'</option>').join("");
  try{if(window.storage){const th=await window.storage.get("pts:theme");
    if(th&&th.value)document.documentElement.setAttribute("data-theme",th.value);}}catch(_){}
  const had=await load();
  if(!had){
    S.crmLinked=await loadCRM();
    if(!S.crmLinked) seedCustomers();
    seedPatients(); seedBookings(); await save();
  }
  render();
  if(S.crmLinked) toast("Customer accounts loaded from the CRM module","ok");
  if(!storageOK) toast("Changes are held for this session only.","bad");
})();

})();
